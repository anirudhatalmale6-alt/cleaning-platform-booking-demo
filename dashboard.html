<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparrow — my account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script>
/* ============================================================
   Customer dashboard.

   The client's list, 19 Aug: "extra features for a signed in
   customer should be being able to make changes to their account,
   see past orders, rate orders (and be able to leave comments),
   save their address for future use and any other features you can
   think of."  The last clause is where notifications, payment
   methods and re-booking come from — those are mine.
   ============================================================ */
let view = 'overview';
const ME = DB.customer;
const NAV = [['index.html','Book a clean'],['dashboard.html','My account']];
const app = () => document.getElementById('app');

const mine = () => DB.bookings.filter(b => b.cust === ME.id);
const upcoming = () => mine().filter(b => b.status === 'upcoming' && !isPast(b.date)).sort((a,b) => a.date.localeCompare(b.date));
const past = () => mine().filter(b => b.status === 'completed' || b.status === 'cancelled').sort((a,b) => b.date.localeCompare(a.date));
const unrated = () => mine().filter(b => b.status === 'completed' && !b.rating);

const ITEMS = () => [
  { id:'overview',  label:'Overview',        icon:'grid' },
  { id:'upcoming',  label:'Upcoming',        icon:'cal',   badge:upcoming().length },
  { id:'past',      label:'Past orders',     icon:'doc',   badge:unrated().length },
  { id:'addresses', label:'My addresses',    icon:'pin'  },
  { id:'cards',     label:'Payment methods', icon:'card' },
  { id:'notifs',    label:'Notifications',   icon:'bell' },
  { id:'account',   label:'My account',      icon:'user' }
];

/* A function, not an object: the greeting has to follow a name change. */
const HEADS = () => ({
  overview:  [`Welcome back, ${ME.name}`, 'Your orders and everything attached to your account.'],
  upcoming:  ['Upcoming orders', 'Cleans you have paid for that have not happened yet.'],
  past:      ['Past orders', 'Everything you have booked. Rate a clean and leave a comment.'],
  addresses: ['My addresses', 'Saved so you do not type them again.'],
  cards:     ['Payment methods', 'Cards on file for checkout.'],
  notifs:    ['Notifications', 'Order updates and reminders.'],
  account:   ['My account', 'Change your details or your password.']
});

function shell(){
  return `${protoBar('dashboard.html')}${topBar('Customer', NAV, 'dashboard.html')}
  <div class="wrap"><div class="shell">
    <aside class="side"><div class="card side-nav" id="sideNav"></div></aside>
    <main>
      <div class="page-head"><h1 id="pgT"></h1><p id="pgS"></p></div>
      <div id="body"></div>
    </main>
  </div></div>`;
}

function render(){
  if(!document.getElementById('body')) app().innerHTML = shell();
  sideNav(ITEMS(), view, id => { view = id; render(); });
  const head = HEADS()[view];
  document.getElementById('pgT').textContent = head[0];
  document.getElementById('pgS').textContent = head[1];
  document.getElementById('body').innerHTML =
    ({ overview:vOverview, upcoming:vUpcoming, past:vPast, addresses:vAddr, cards:vCards, notifs:vNotifs, account:vAccount })[view]();
  wire();
}

/* ---------- shared order card ---------- */
function orderCard(b, opts = {}){
  const p = priceBooking(b), cl = cleaner(b.cleaner), a = addrOf(b);
  return `<div class="card panel" style="margin-bottom:12px">
    <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:12px">
      ${cl ? portrait(cl, 54) : ''}
      <div style="flex:1;min-width:0">
        <div style="font-family:'Fraunces',serif;font-size:20px">${svcOf(b.service).name}</div>
        <div class="mini">${b.id} · ${fmtDateLong(b.date)} at ${b.time} · ${p.hoursLabel}</div>
        ${cl ? `<div class="mini">${cl.name} ${cl.surname}</div>` : ''}
      </div>
      ${statusPill(b.status)}
    </div>
    <dl class="kv" style="margin-bottom:12px">
      <dt>Job</dt><dd>${esc(jobDetail(b))}</dd>
      <dt>Where</dt><dd>${esc([a.unit, a.line].filter(Boolean).join(', '))}, ${esc(a.suburb)}</dd>
      ${b.extras && b.extras.length ? `<dt>Extras</dt><dd>${b.extras.map(id => CFG.extras.find(e => e.id === id).name).join(', ')}</dd>` : ''}
      ${b.note ? `<dt>Your note</dt><dd>“${esc(b.note)}”</dd>` : ''}
      <dt>Paid</dt><dd class="t-strong">${money(p.total)}</dd>
    </dl>
    ${b.rating ? `<div class="review"><div class="rv-h"><span class="stars">${starRow(b.rating.stars)}</span> Your rating</div>
      ${b.rating.comment ? `<div class="rv-b">“${esc(b.rating.comment)}”</div>` : '<div class="rv-b mini">No comment left.</div>'}</div>` : ''}
    <div class="hbar">${opts.actions || ''}</div>
  </div>`;
}

/* ---------- overview ---------- */
function vOverview(){
  const up = upcoming(), ur = unrated();
  const spent = mine().filter(b => b.status !== 'cancelled').reduce((n, b) => n + priceBooking(b).total, 0);
  return `
    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="s-l">Upcoming</div><div class="s-v">${up.length}</div><div class="s-d">${up.length ? 'next ' + fmtDate(up[0].date) : 'nothing booked'}</div></div>
      <div class="stat"><div class="s-l">Orders</div><div class="s-v">${mine().length}</div><div class="s-d">since ${ME.joined}</div></div>
      <div class="stat"><div class="s-l">Spent</div><div class="s-v">${money(spent)}</div><div class="s-d">all time</div></div>
      <div class="stat"><div class="s-l">To rate</div><div class="s-v">${ur.length}</div><div class="s-d">${ur.length ? 'waiting on you' : 'all done'}</div></div>
    </div>

    <div class="qa-grid" style="margin-bottom:22px">
      <a class="qa" href="index.html">${ico('plus',22,1.8)}<div class="q-t">Book a clean</div><div class="q-s">Pick your service and your cleaner</div></a>
      <button class="qa" data-view="addresses">${ico('pin',22,1.8)}<div class="q-t">My addresses</div><div class="q-s">${DB.addresses.length} saved</div></button>
      <button class="qa" data-view="past">${ico('star',22,1.8)}<div class="q-t">Rate a clean</div><div class="q-s">${ur.length ? ur.length + ' waiting' : 'nothing waiting'}</div></button>
    </div>

    ${ur.length ? `<div class="sect-head"><h2>How did it go?</h2>
        <div class="sh-sub">Ratings help other customers pick.</div></div>
      ${orderCard(ur[0], { actions:`<button class="btn btn-primary sm" data-rate="${ur[0].id}">${ico('star',15,2)} Rate this clean</button>` })}` : ''}

    <div class="sect-head" style="margin-top:20px"><h2>Upcoming</h2>
      <button class="btn btn-outline sm sh-act" data-view="upcoming">See all</button></div>
    ${up.length ? up.slice(0,2).map(b => orderCard(b, {
        actions:`<button class="btn btn-outline sm" data-cancel="${b.id}">Cancel</button>` })).join('')
      : `<div class="card panel"><div class="empty">${ico('cal',40,1.4)}<div class="e-t">Nothing booked</div>
          <div>Book a clean and it will show up here.</div></div></div>`}`;
}

/* ---------- upcoming ---------- */
function vUpcoming(){
  const up = upcoming();
  return up.length ? up.map(b => orderCard(b, {
      actions:`<button class="btn btn-outline sm" data-cancel="${b.id}">Cancel order</button>
               <a class="btn btn-ghost sm" href="index.html">Book another</a>` })).join('')
    : `<div class="card panel"><div class="empty">${ico('cal',40,1.4)}<div class="e-t">Nothing booked</div>
        <div>You have no cleans coming up.</div></div></div>`;
}

/* ---------- past orders ---------- */
function vPast(){
  const list = past();
  return list.length ? list.map(b => orderCard(b, {
      actions: b.status === 'completed'
        ? `${b.rating
             ? `<button class="btn btn-outline sm" data-rate="${b.id}">Change my rating</button>`
             : `<button class="btn btn-primary sm" data-rate="${b.id}">${ico('star',15,2)} Rate this clean</button>`}
           <button class="btn btn-ghost sm" data-again="${b.id}">Book ${cleaner(b.cleaner) ? cleaner(b.cleaner).name : 'again'} again</button>`
        : '' })).join('')
    : `<div class="card panel"><div class="empty">${ico('doc',40,1.4)}<div class="e-t">No past orders</div></div></div>`;
}

/* ---------- rating, with a comment ---------- */
function rateFlow(id){
  const b = DB.bookings.find(x => x.id === id);
  const cl = cleaner(b.cleaner);
  let stars = b.rating ? b.rating.stars : 0;
  const v = modal({ title:`Rate ${cl ? cl.name : 'this clean'}`,
    sub:`${svcOf(b.service).name} · ${fmtDateLong(b.date)}`,
    body:`<div class="rate-stars" id="rs">${[1,2,3,4,5].map(n =>
        `<button data-star="${n}" class="${n <= stars ? 'on' : ''}">★</button>`).join('')}</div>
      <div class="field"><label>Leave a comment</label>
        <textarea id="rComment" rows="4" placeholder="What went well, what could be better?">${esc(b.rating ? b.rating.comment : '')}</textarea>
        <div class="hint">Your comment shows on ${cl ? cl.name + '’s' : 'the cleaner’s'} profile and helps other customers choose.</div></div>
      <div class="err" id="rErr" style="display:none;font-size:12.5px;color:var(--clay)">Pick a star rating first.</div>`,
    actions:[
      { label:'Cancel', cls:'btn-outline' },
      { label:'Submit rating', cls:'btn-primary', fn:(veil) => {
          if(!stars){ veil.querySelector('#rErr').style.display = 'block'; return true; }
          b.rating = { stars, comment:veil.querySelector('#rComment').value.trim() };
          render();
          toast('Thanks — your rating is live on ' + (cl ? cl.name + '’s' : 'their') + ' profile');
        } }
    ] });
  const paint = () => v.querySelectorAll('[data-star]').forEach(s =>
    s.classList.toggle('on', +s.dataset.star <= stars));
  v.querySelectorAll('[data-star]').forEach(s => s.onclick = () => { stars = +s.dataset.star; paint(); });
}

/* ---------- addresses ---------- */
function vAddr(){
  return `<div class="rows" style="margin-bottom:14px">${DB.addresses.map(a => `
      <div class="row-card">${ico('pin',20,1.8)}
        <div class="rc-main">
          <div class="rc-t">${esc(a.label)} ${a.primary ? '<span class="pill ok" style="margin-left:6px">Default</span>' : ''}</div>
          <div class="rc-s">${esc([a.unit, a.line].filter(Boolean).join(', '))}, ${esc(a.suburb)}, ${esc(a.city)} · ${esc(a.type)}</div>
          ${a.notes ? `<div class="rc-s">${esc(a.notes)}</div>` : ''}
        </div>
        <div class="rc-act">
          ${a.primary ? '' : `<button class="btn btn-outline sm" data-primary="${a.id}">Make default</button>`}
          <button class="btn btn-ghost sm" data-editaddr="${a.id}">Edit</button>
        </div>
      </div>`).join('')}</div>
    <button class="btn btn-primary" id="addAddr">${ico('plus',16,2.2)} Add an address</button>`;
}

function addrFlow(a){
  const isNew = !a;
  const v = modal({ title:isNew ? 'Add an address' : `Edit ${a.label}`,
    body:`<div class="field"><label>Label</label><input id="eLabel" value="${esc(a ? a.label : '')}" placeholder="Home, office, Mom’s place"><div class="err">Give it a name</div></div>
      <div class="field"><label>Type of property</label><select id="eType">
        ${CFG.propertyTypes.map(t => `<option ${a && a.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div class="field"><label>Street address</label><input id="eLine" value="${esc(a ? a.line : '')}"><div class="err">Enter the street address</div></div>
      <div class="grid2">
        <div class="field"><label>Unit / flat number</label><input id="eUnit" value="${esc(a ? a.unit : '')}"></div>
        <div class="field"><label>Suburb</label><input id="eSub" value="${esc(a ? a.suburb : '')}"><div class="err">Enter the suburb</div></div>
      </div>
      <div class="field"><label>Notes for the cleaner</label><textarea id="eNotes" rows="2">${esc(a ? a.notes : '')}</textarea></div>`,
    actions:[
      { label:'Cancel', cls:'btn-outline' },
      ...(isNew ? [] : [{ label:'Delete', cls:'btn-danger', fn:() => {
          DB.addresses = DB.addresses.filter(x => x.id !== a.id);
          if(DB.addresses.length && !DB.addresses.some(x => x.primary)) DB.addresses[0].primary = true;
          render(); toast('Address removed');
        } }]),
      { label:'Save', cls:'btn-primary', fn:(veil) => {
          const g = id => veil.querySelector('#' + id);
          let ok = true;
          [['eLabel', v => v.trim().length > 1], ['eLine', v => v.trim().length > 3], ['eSub', v => v.trim().length > 1]]
            .forEach(([id, test]) => {
              const el = g(id), good = test(el.value);
              el.closest('.field').classList.toggle('bad', !good);
              if(!good) ok = false;
            });
          if(!ok) return true;
          const rec = { label:g('eLabel').value, type:g('eType').value, line:g('eLine').value,
            unit:g('eUnit').value, suburb:g('eSub').value, city:'Cape Town', prov:'Western Cape',
            notes:g('eNotes').value };
          if(isNew) DB.addresses.push({ id:'a' + (DB.addresses.length + 1), primary:!DB.addresses.length, ...rec });
          else Object.assign(a, rec);
          render(); toast(isNew ? 'Address saved' : 'Address updated');
        } }
    ] });
  return v;
}

/* ---------- cards ---------- */
function vCards(){
  return `<div class="rows" style="margin-bottom:14px">${DB.cards.map(c => `
      <div class="row-card">${ico('card',20,1.8)}
        <div class="rc-main"><div class="rc-t">${c.brand} ···· ${c.last4} ${c.primary ? '<span class="pill ok" style="margin-left:6px">Default</span>' : ''}</div>
          <div class="rc-s">Expires ${c.exp}</div></div>
        <div class="rc-act">
          ${c.primary ? '' : `<button class="btn btn-outline sm" data-defcard="${c.id}">Make default</button>`}
          <button class="btn btn-danger sm" data-delcard="${c.id}">Remove</button>
        </div>
      </div>`).join('')}</div>
    <button class="btn btn-primary" id="addCard">${ico('plus',16,2.2)} Add a card</button>
    <div class="note" style="margin-top:16px">${ico('shield',16,2)}
      <span>Card details never touch our own database — the live site hands them straight to the gateway and keeps only the last four digits.</span></div>`;
}

/* ---------- notifications ---------- */
function vNotifs(){
  return `<div class="rows">${DB.notifications.map(n => `
    <div class="row-card">
      <span class="pill ${n.kind}">${n.kind === 'ok' ? 'Done' : n.kind === 'wait' ? 'Action' : 'Info'}</span>
      <div class="rc-main"><div class="rc-t">${esc(n.t)}</div><div class="rc-s">${esc(n.s)}</div></div>
    </div>`).join('')}</div>`;
}

/* ---------- account ---------- */
function vAccount(){
  return `<div class="card panel" style="margin-bottom:14px">
      <div class="who" style="margin-bottom:16px">
        <div class="avatar lg">${ME.initials}</div>
        <div><div style="font-family:'Fraunces',serif;font-size:22px">${ME.name} ${ME.surname}</div>
          <div class="mini">${ME.memberNo} · with us since ${ME.joined}</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>First name</label><input id="acFirst" value="${esc(ME.name)}"><div class="err">Required</div></div>
        <div class="field"><label>Surname</label><input id="acLast" value="${esc(ME.surname)}"><div class="err">Required</div></div>
      </div>
      <div class="field"><label>Email address</label><input id="acEmail" value="${esc(ME.email)}"><div class="err">Enter a valid email address</div></div>
      <div class="field"><label>Mobile number</label><input id="acPhone" value="${esc(ME.phone)}"><div class="err">Enter a valid South African mobile number</div></div>
      <button class="btn btn-primary" id="acSave">Save changes</button>
    </div>

    <div class="card panel">
      <div class="sect-head"><h2 style="font-size:20px">Password</h2></div>
      <div class="field"><label>Current password</label><input type="password" id="acOld" value="demo1234"></div>
      <div class="grid2">
        <div class="field"><label>New password</label><input type="password" id="acNew"><div class="err">At least 8 characters</div></div>
        <div class="field"><label>Confirm new password</label><input type="password" id="acNew2"><div class="err">Passwords do not match</div></div>
      </div>
      <button class="btn btn-outline" id="acPass">Change password</button>
    </div>`;
}

/* ---------- wiring ---------- */
function wire(){
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };

  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  document.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => rateFlow(b.dataset.rate));
  document.querySelectorAll('[data-again]').forEach(b => b.onclick = () => { location.href = 'index.html'; });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    const bk = DB.bookings.find(x => x.id === b.dataset.cancel);
    modal({ title:'Cancel this order?', sub:`${bk.id} · ${fmtDateLong(bk.date)} at ${bk.time}`,
      body:`<p style="font-size:14px;margin:0">Cancelling more than 12 hours before the clean is free and the money goes back to your card in 3 to 5 working days. ${cleaner(bk.cleaner) ? cleaner(bk.cleaner).name + ' is told straight away.' : ''}</p>`,
      actions:[{ label:'Keep it', cls:'btn-outline' },
        { label:'Cancel the order', cls:'btn-danger', fn:() => { bk.status = 'cancelled'; render(); toast('Order cancelled — refund on its way'); } }] });
  });

  document.querySelectorAll('[data-primary]').forEach(b => b.onclick = () => {
    DB.addresses.forEach(a => a.primary = a.id === b.dataset.primary);
    render(); toast('Default address updated');
  });
  document.querySelectorAll('[data-editaddr]').forEach(b => b.onclick = () => addrFlow(address(b.dataset.editaddr)));
  on('addAddr', () => addrFlow(null));

  document.querySelectorAll('[data-defcard]').forEach(b => b.onclick = () => {
    DB.cards.forEach(c => c.primary = c.id === b.dataset.defcard);
    render(); toast('Default card updated');
  });
  document.querySelectorAll('[data-delcard]').forEach(b => b.onclick = () => {
    if(DB.cards.length === 1) return toast('Keep at least one card on file', 'info');
    DB.cards = DB.cards.filter(c => c.id !== b.dataset.delcard);
    if(!DB.cards.some(c => c.primary)) DB.cards[0].primary = true;
    render(); toast('Card removed');
  });
  on('addCard', () => modal({ title:'Add a card',
    body:`<div class="field"><label>Card number</label><input placeholder="0000 0000 0000 0000"></div>
      <div class="grid2"><div class="field"><label>Expiry</label><input placeholder="MM / YY"></div>
      <div class="field"><label>CVV</label><input placeholder="123"></div></div>
      <div class="note">${ico('shield',16,2)}<span>On the live site this form is the gateway's own, so the number never reaches our server.</span></div>`,
    actions:[{ label:'Cancel', cls:'btn-outline' },
      { label:'Add card', cls:'btn-primary', fn:() => {
        DB.cards.push({ id:'c' + (DB.cards.length + 1), brand:'Visa', last4:'0117', exp:'11/30', primary:false });
        render(); toast('Card added'); } }] }));

  on('acSave', () => {
    const g = id => document.getElementById(id);
    const checks = [
      [g('acFirst'), g('acFirst').value.trim().length > 1],
      [g('acLast'),  g('acLast').value.trim().length > 1],
      [g('acEmail'), /\S+@\S+\.\S+/.test(g('acEmail').value)],
      [g('acPhone'), /^(\+27|0)[6-8][0-9\s]{8,11}$/.test(g('acPhone').value.replace(/\s/g,''))]
    ];
    let bad = false;
    checks.forEach(([el, ok]) => { el.closest('.field').classList.toggle('bad', !ok); if(!ok) bad = true; });
    if(bad) return;
    ME.name = g('acFirst').value; ME.surname = g('acLast').value;
    ME.email = g('acEmail').value; ME.phone = g('acPhone').value;
    ME.initials = (ME.name[0] + ME.surname[0]).toUpperCase();
    render(); toast('Account updated');
  });

  on('acPass', () => {
    const n = document.getElementById('acNew'), n2 = document.getElementById('acNew2');
    let bad = false;
    [[n, n.value.length >= 8], [n2, n2.value === n.value && n2.value.length >= 8]].forEach(([el, ok]) => {
      el.closest('.field').classList.toggle('bad', !ok); if(!ok) bad = true;
    });
    if(bad) return;
    n.value = ''; n2.value = '';
    toast('Password changed');
  });
}

app().innerHTML = shell();
render();
</script>
</body>
</html>
