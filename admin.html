<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparrow — admin dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .searchbar{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink-14);border-radius:999px;padding:9px 16px;background:var(--paper-2);margin-bottom:14px}
  .searchbar input{border:0;background:transparent;font:inherit;font-size:14.5px;width:100%;outline:none;color:var(--ink)}
  .searchbar svg{color:var(--ink-45);flex:0 0 auto}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script>
/* ============================================================
   Admin dashboard.

   From the client, 19 Aug: list employees by role (indoor /
   outdoor); show new registrations; approve or decline them —
   approve sends a congratulations message, decline takes a comment
   and sends the reason; show signed-up customers and their order
   history; and for a new registration, view the submitted form and
   download the documents.
   ============================================================ */
let view = 'overview';
let custQ = '';
let roleFilter = 'all';

const NAV = [['index.html','Website'],['admin.html','Admin']];
const app = () => document.getElementById('app');

const pendingApps = () => DB.applications.filter(a => cleaner(a.id) && cleaner(a.id).account === 'pending');
const newOrders   = () => DB.bookings.filter(b => b.status === 'upcoming' && !isPast(b.date));

const ITEMS = () => [
  { id:'overview', label:'Overview',       icon:'grid' },
  { id:'orders',   label:'Orders',         icon:'cal',    badge:newOrders().length },
  { id:'apps',     label:'New registrations', icon:'doc', badge:pendingApps().length },
  { id:'staff',    label:'Employees',      icon:'users' },
  { id:'custs',    label:'Customers',      icon:'user' },
  { id:'outbox',   label:'Sent messages',  icon:'mail' }
];

function shell(){
  return `${protoBar('admin.html')}${topBar('Admin', NAV, 'admin.html')}
  <div class="wrap"><div class="shell">
    <aside class="side"><div class="card side-nav" id="sideNav"></div></aside>
    <main>
      <div class="page-head"><h1 id="pgT"></h1><p id="pgS"></p></div>
      <div id="body"></div>
    </main>
  </div></div>`;
}

const HEADS = {
  overview:['Welcome back, Lebo','Everything that needs you this morning.'],
  orders:  ['Orders','Every booking customers have placed, newest first.'],
  apps:    ['New registrations','Read the form, download the documents, then approve or decline.'],
  staff:   ['Employees','Everyone on the books, by role.'],
  custs:   ['Customers','Signed-up customers and what they have ordered.'],
  outbox:  ['Sent messages','Every automatic email and SMS the platform has sent this session.']
};

function render(){
  if(!document.getElementById('body')) app().innerHTML = shell();
  sideNav(ITEMS(), view, id => { view = id; render(); });
  document.getElementById('pgT').textContent = HEADS[view][0];
  document.getElementById('pgS').textContent = HEADS[view][1];
  document.getElementById('body').innerHTML =
    ({ overview:vOverview, orders:vOrders, apps:vApps, staff:vStaff, custs:vCusts, outbox:vOutbox })[view]();
  wire();
}

/* ---------- overview ---------- */
function vOverview(){
  const orders = DB.bookings.filter(b => b.status !== 'cancelled');
  const revenue = orders.reduce((n, b) => n + priceBooking(b).total, 0);
  const apps = pendingApps();
  return `
    <div class="stats" style="margin-bottom:18px">
      <div class="stat"><div class="s-l">Orders</div><div class="s-v">${orders.length}</div><div class="s-d">${newOrders().length} still to come</div></div>
      <div class="stat"><div class="s-l">Taken</div><div class="s-v">${money(revenue)}</div><div class="s-d">across all orders</div></div>
      <div class="stat"><div class="s-l">Employees</div><div class="s-v">${DB.cleaners.filter(c => c.account === 'approved').length}</div><div class="s-d">approved and working</div></div>
      <div class="stat"><div class="s-l">Waiting on you</div><div class="s-v">${apps.length}</div><div class="s-d">${apps.length ? 'new registrations' : 'nothing pending'}</div></div>
    </div>

    <div class="sect-head"><h2>New registrations</h2>
      <button class="btn btn-outline sm sh-act" data-view="apps">See all</button></div>
    ${apps.length ? `<div class="rows" style="margin-bottom:22px">${apps.slice(0,3).map(a => {
      const c = cleaner(a.id);
      return `<div class="row-card">${portrait(c, 42)}
        <div class="rc-main"><div class="rc-t">${c.name} ${c.surname}</div>
          <div class="rc-s">${c.group === 'indoor' ? 'Indoor' : 'Outdoor'} cleaner · ${c.city} · applied ${fmtDate(a.submitted)}</div></div>
        <div class="rc-act"><button class="btn btn-outline sm" data-form="${c.id}">View form</button></div></div>`;
    }).join('')}</div>` : `<div class="card panel" style="margin-bottom:22px"><div class="empty">${ico('check',36,1.5)}
        <div class="e-t">Queue is clear</div><div>No registrations waiting.</div></div></div>`}

    <div class="sect-head"><h2>Latest orders</h2>
      <button class="btn btn-outline sm sh-act" data-view="orders">See all</button></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Cleaner</th><th>When</th><th class="num">Total</th></tr></thead>
      <tbody>${DB.bookings.slice(0,5).map(b => orderRow(b)).join('')}</tbody>
    </table></div>`;
}

function orderRow(b){
  const p = priceBooking(b), c = custOf(b.cust), cl = cleaner(b.cleaner);
  return `<tr data-order="${b.id}" style="cursor:pointer">
    <td class="t-strong">${b.id}<div class="t-sub">${STATUS[b.status].label}</div></td>
    <td>${esc(c ? c.name : '—')}</td>
    <td>${svcOf(b.service).name}<div class="t-sub">${p.hoursLabel}</div></td>
    <td>${cl ? `${cl.name} ${cl.surname}` : '—'}</td>
    <td>${fmtDate(b.date)}<div class="t-sub">${b.time}</div></td>
    <td class="num">${money(p.total)}</td>
  </tr>`;
}

/* ---------- orders ---------- */
function vOrders(){
  const list = [...DB.bookings].sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Order</th><th>Customer</th><th>Service</th><th>Cleaner</th><th>When</th><th class="num">Total</th></tr></thead>
    <tbody>${list.map(b => orderRow(b)).join('')}</tbody></table></div>
    <div class="note" style="margin-top:14px">${ico('info',16,2)}
      <span>Click any row for the full order. The customer picks their own cleaner at checkout, so orders arrive already assigned — nothing here needs your approval.</span></div>`;
}

function showOrder(id){
  const b = DB.bookings.find(x => x.id === id);
  const p = priceBooking(b), c = custOf(b.cust), cl = cleaner(b.cleaner), a = addrOf(b);
  modal({ title:b.id, sub:`${svcOf(b.service).name} · ${fmtDateLong(b.date)} at ${b.time}`, wide:true,
    body:`<dl class="kv" style="margin-bottom:16px">
        <dt>Status</dt><dd>${statusPill(b.status)}</dd>
        <dt>Customer</dt><dd>${esc(c ? c.name : '—')}${c ? ` · ${esc(c.phone)}` : ''}</dd>
        <dt>Cleaner</dt><dd>${cl ? `${cl.name} ${cl.surname} (${cl.group === 'indoor' ? 'Indoor' : 'Outdoor'})` : '—'}</dd>
        <dt>Address</dt><dd>${esc([a.unit, a.line].filter(Boolean).join(', '))}, ${esc(a.suburb)}, ${esc(a.city)}</dd>
        ${a.notes ? `<dt>Access</dt><dd>${esc(a.notes)}</dd>` : ''}
        ${b.note ? `<dt>Note to cleaner</dt><dd>“${esc(b.note)}”</dd>` : ''}
        ${b.extras && b.extras.length ? `<dt>Extras</dt><dd>${b.extras.map(x => CFG.extras.find(e => e.id === x).name).join(', ')}</dd>` : ''}
        <dt>Duration</dt><dd>${p.hoursLabel}</dd>
      </dl>
      <div class="rule"></div>
      <div class="li"><span>Flat rate</span><span class="v">${money(p.flat)}</span></div>
      <div class="li"><span>${p.serviceHoursLabel} @ ${money(CFG.hourlyRate)}/hr</span><span class="v">${money(p.labour)}</span></div>
      ${p.extras ? `<div class="li"><span>Extra tasks</span><span class="v">${money(p.extras)}</span></div>` : ''}
      <div class="li"><span>Service fee</span><span class="v">${money(p.fee)}</span></div>
      <div class="rule"></div>
      <div class="total"><span class="t-l">Total</span><span class="t-v">${money(p.total)}</span></div>
      ${b.rating ? `<div class="rule"></div><div class="review"><div class="rv-h"><span class="stars">${starRow(b.rating.stars)}</span> ${esc(c ? c.name : '')}</div>
        ${b.rating.comment ? `<div class="rv-b">“${esc(b.rating.comment)}”</div>` : ''}</div>` : ''}`,
    actions:[{ label:'Close', cls:'btn-primary' }] });
}

/* ---------- new registrations ---------- */
function vApps(){
  const apps = pendingApps();
  if(!apps.length) return `<div class="card panel"><div class="empty">${ico('check',40,1.5)}
    <div class="e-t">Nothing waiting</div><div>Every registration has been dealt with.</div></div></div>`;
  return `<div class="rows">${apps.map(a => {
    const c = cleaner(a.id);
    return `<div class="row-card">
      ${portrait(c, 54)}
      <div class="rc-main">
        <div class="rc-t">${c.name} ${c.surname}</div>
        <div class="rc-s">${c.group === 'indoor' ? 'Indoor' : 'Outdoor'} cleaner · ${c.city}, ${c.prov} · ${c.years} years · applied ${fmtDate(a.submitted)}</div>
      </div>
      <div class="rc-act">
        <button class="btn btn-outline sm" data-form="${c.id}">View form</button>
        <button class="btn btn-primary sm" data-approve="${c.id}">Approve</button>
        <button class="btn btn-danger sm" data-decline="${c.id}">Decline</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function showForm(id){
  const c = cleaner(id);
  const a = DB.applications.find(x => x.id === id);
  modal({ title:`${c.name} ${c.surname}`, sub:`Submitted ${a ? fmtDateLong(a.submitted) : '—'}`, wide:true,
    body:`
      <div class="pro-line" style="margin-bottom:16px">${portrait(c, 72)}
        <div><div class="t-strong">${c.name} ${c.surname}</div>
          <div class="mini">${c.group === 'indoor' ? 'Indoor' : 'Outdoor'} cleaner · ${c.years} years</div>
          <div class="mini">${ACCOUNT[c.account].label}</div></div></div>
      <dl class="kv" style="margin-bottom:16px">
        <dt>Mobile</dt><dd>+27 82 000 0000</dd>
        <dt>Email</dt><dd>${esc(c.name.toLowerCase())}.${esc(c.surname[0].toLowerCase())}@example.co.za</dd>
        <dt>Province</dt><dd>${esc(c.prov)}</dd>
        <dt>Cities</dt><dd>${esc(c.city)}</dd>
        <dt>Languages</dt><dd>${c.langs.join(', ')}</dd>
        <dt>Own transport</dt><dd>Yes</dd>
        <dt>ID number</dt><dd>9•••••••••••3</dd>
      </dl>
      <div class="fieldset-t">References</div>
      <dl class="kv" style="margin-bottom:16px">
        <dt>1</dt><dd>Mrs A. Fourie · 082 111 2222 · weekly clean, 4 years</dd>
        <dt>2</dt><dd>Riaan van Wyk · 083 220 7712 · office clean, 2 years</dd>
      </dl>
      <div class="fieldset-t">Documents</div>
      <div class="docs">${DOCS.map(d => `<div class="doc-row">${ico('doc',20,1.8)}
        <div class="dr-main"><div class="dr-t">${d.name}</div><div class="dr-s">${d.file} · ${d.size}</div></div>
        <button class="btn btn-outline sm" data-dl="${d.file}">${ico('download',15,2)} Download</button></div>`).join('')}</div>
      <div class="note" style="margin-top:14px">${ico('info',16,2)}
        <span>Downloads are stubbed until there is a backend holding the real uploads. The button proves the wiring, not the file.</span></div>`,
    actions:[
      { label:'Close', cls:'btn-outline' },
      { label:'Decline', cls:'btn-danger', fn:() => { setTimeout(() => declineFlow(id), 60); } },
      { label:'Approve', cls:'btn-primary', fn:() => { setTimeout(() => approve(id), 60); } }
    ] });
}

function approve(id){
  const c = cleaner(id);
  c.account = 'approved';
  DB.applications = DB.applications.filter(x => x.id !== id);
  render();
  toast(`${c.name} approved — they can sign in now`);
  sendNotice({ channel:'email', to:`${c.name.toLowerCase()}.${c.surname[0].toLowerCase()}@example.co.za`,
    subject:'Congratulations — you are approved to work with Sparrow',
    body:`<h4>Welcome aboard, ${c.name}.</h4>
      <p>Your application has been approved. You can sign in to your cleaner dashboard right now.</p>
      <p>First thing to do: open your calendar and block off any days you cannot work. Customers in ${esc(c.city)} will see you on every day you leave open, and they book you directly.</p>
      <p><a class="m-btn" href="#">Sign in to your dashboard</a></p>
      <p style="color:#6b7a70;font-size:12.5px">You are listed as ${c.group === 'indoor' ? 'an indoor' : 'an outdoor'} cleaner covering ${esc(c.city)}.</p>` });
}

function declineFlow(id){
  const c = cleaner(id);
  const v = modal({ title:`Decline ${c.name} ${c.surname}`,
    sub:'The reason you write is sent to them, so write it as you want them to read it.',
    body:`<div class="field"><label>Why are you declining? <span class="req">*</span></label>
        <textarea id="dcReason" rows="4" placeholder="e.g. The criminal record check came back unresolved."></textarea>
        <div class="err" id="dcErr" style="display:none">Write a reason — it goes to the applicant.</div></div>
      <div class="field"><label>Send it by</label>
        <div class="radios" id="dcCh"><button data-c="email" class="on">Email</button><button data-c="sms">SMS</button></div></div>`,
    actions:[
      { label:'Cancel', cls:'btn-outline' },
      { label:'Decline and send', cls:'btn-danger', fn:(veil) => {
          const t = veil.querySelector('#dcReason').value.trim();
          if(t.length < 8){ veil.querySelector('#dcErr').style.display = 'block'; return true; }
          const ch = veil.querySelector('#dcCh .on').dataset.c;
          c.account = 'declined'; c.declineReason = t;
          DB.applications = DB.applications.filter(x => x.id !== id);
          render();
          toast(`${c.name} declined — ${ch === 'sms' ? 'SMS' : 'email'} sent`);
          setTimeout(() => sendNotice({ channel:ch,
            to: ch === 'sms' ? `${c.name} ${c.surname} · +27 82 000 0000`
                             : `${c.name.toLowerCase()}.${c.surname[0].toLowerCase()}@example.co.za`,
            subject: ch === 'sms' ? '' : 'About your Sparrow application',
            body:`<p>Hi ${c.name},</p>
              <p>Thank you for applying to work with Sparrow. We are not able to take your application further at this time.</p>
              <p><b>Reason:</b> ${esc(t)}</p>
              <p>You are welcome to apply again once that changes.</p>` }), 80);
        } }
    ] });
  v.querySelectorAll('#dcCh button').forEach(b => b.onclick = () => {
    v.querySelectorAll('#dcCh button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
}

/* ---------- employees, by role ---------- */
function vStaff(){
  const all = DB.cleaners.filter(c => c.account !== 'pending');
  const list = roleFilter === 'all' ? all : all.filter(c => c.group === roleFilter);
  const group = g => list.filter(c => c.group === g);
  const block = (g, title) => {
    const rows = group(g);
    if(!rows.length) return '';
    return `<div class="sect-head" style="margin-top:20px"><h2>${title}</h2>
      <div class="sh-sub">${rows.length} on the books</div></div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Employee</th><th>Area</th><th>Rating</th><th>Jobs</th><th>Account</th><th></th></tr></thead>
        <tbody>${rows.map(c => {
          const r = ratingOf(c.id);
          const done = DB.bookings.filter(b => b.cleaner === c.id && b.status === 'completed').length;
          return `<tr>
            <td><div class="who">${portrait(c, 34)}<div><div class="w-n">${c.name} ${c.surname}</div>
              <div class="w-s">${c.years} years · ${c.langs.slice(0,2).join(', ')}</div></div></div></td>
            <td>${esc(c.city)}<div class="t-sub">${esc(c.prov)}</div></td>
            <td>${r ? `<span class="stars">${starRow(r)}</span><div class="t-sub">${r.toFixed(2)}</div>` : '<span class="t-sub">no ratings</span>'}</td>
            <td class="num">${done}</td>
            <td><span class="pill ${ACCOUNT[c.account].cls}">${ACCOUNT[c.account].label}</span></td>
            <td><button class="btn btn-outline sm" data-staff="${c.id}">Open</button></td>
          </tr>`;
        }).join('')}</tbody></table></div>`;
  };
  return `<div class="chips" style="margin-bottom:6px">
      ${[['all','Everyone'],['indoor','Indoor'],['outdoor','Outdoor']].map(([k,l]) =>
        `<button class="chip ${roleFilter === k ? 'on' : ''}" data-role="${k}">${l}</button>`).join('')}
    </div>
    ${block('indoor','Indoor cleaners')}
    ${block('outdoor','Outdoor cleaners')}
    ${list.length ? '' : `<div class="card panel"><div class="empty">${ico('users',40,1.4)}<div class="e-t">Nobody in this role</div></div></div>`}`;
}

function showStaff(id){
  const c = cleaner(id);
  const jobs = DB.bookings.filter(b => b.cleaner === id);
  const revs = reviewsFor(id);
  const earned = jobs.filter(b => b.status === 'completed')
    .reduce((n, b) => { const p = priceBooking(b); return n + p.labour + p.extras; }, 0);
  modal({ title:`${c.name} ${c.surname}`, sub:`${c.group === 'indoor' ? 'Indoor' : 'Outdoor'} cleaner · ${c.city}`, wide:true,
    body:`<div class="pro-line" style="margin-bottom:16px">${portrait(c, 72)}
        <div><div class="mini">${ratingOf(id) ? `${starRow(ratingOf(id))} ${ratingOf(id).toFixed(2)}` : 'No ratings yet'}</div>
          <div class="mini">${jobs.filter(b => b.status === 'completed').length} completed · ${money(earned)} earned</div>
          <div class="mini">Account ${ACCOUNT[c.account].label.toLowerCase()}</div></div></div>
      ${(c.blocked || []).length ? `<div class="note warn">${ico('cal',16,2)}
        <span>Unavailable on ${c.blocked.map(fmtDate).join(', ')} — they blocked these off themselves.</span></div>` : ''}
      <div class="fieldset-t">Bookings</div>
      ${jobs.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:0">
        <thead><tr><th>Order</th><th>When</th><th>Status</th></tr></thead>
        <tbody>${jobs.map(b => `<tr><td class="t-strong">${b.id}</td><td>${fmtDate(b.date)}</td><td>${statusPill(b.status)}</td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="mini">No bookings yet.</div>'}
      ${revs.length ? `<div class="fieldset-t">Ratings</div>
        ${revs.map(v => `<div class="review"><div class="rv-h"><span class="stars">${starRow(v.stars)}</span> ${esc(v.cust)} · ${fmtDate(v.date)}</div>
          ${v.comment ? `<div class="rv-b">“${esc(v.comment)}”</div>` : ''}</div>`).join('')}` : ''}`,
    actions:[{ label:'Close', cls:'btn-primary' }] });
}

/* ---------- customers ---------- */
function vCusts(){
  const q = custQ.toLowerCase();
  const list = DB.customers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.phone.includes(q));
  return `<div class="searchbar">${ico('search',18,2)}
      <input id="custSearch" placeholder="Search by name, email or number" value="${esc(custQ)}"></div>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Customer</th><th>Contact</th><th>Orders</th><th class="num">Spent</th><th></th></tr></thead>
      <tbody id="custBody">${list.map(c => {
        const orders = DB.bookings.filter(b => b.cust === c.id && b.status !== 'cancelled');
        const spend = orders.reduce((n, b) => n + priceBooking(b).total, 0);
        return `<tr>
          <td><div class="who"><div class="avatar sm ${c.tone}">${c.initials}</div>
            <div><div class="w-n">${esc(c.name)}</div><div class="w-s">Joined ${c.joined}</div></div></div></td>
          <td>${esc(c.email)}<div class="t-sub">${esc(c.phone)}</div></td>
          <td class="num">${orders.length}</td>
          <td class="num">${money(spend)}</td>
          <td><button class="btn btn-outline sm" data-cust="${c.id}">Order history</button></td>
        </tr>`;
      }).join('')}</tbody></table></div>`
    : `<div class="card panel"><div class="empty">${ico('search',40,1.4)}<div class="e-t">Nobody matches “${esc(custQ)}”</div></div></div>`}`;
}

function showCust(id){
  const c = custOf(id);
  const orders = DB.bookings.filter(b => b.cust === id).sort((a, b) => b.date.localeCompare(a.date));
  const spend = orders.filter(b => b.status !== 'cancelled').reduce((n, b) => n + priceBooking(b).total, 0);
  modal({ title:c.name, sub:`${esc(c.email)} · ${esc(c.phone)} · joined ${c.joined}`, wide:true,
    body:`<div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
        <div class="stat"><div class="s-l">Orders</div><div class="s-v">${orders.length}</div></div>
        <div class="stat"><div class="s-l">Spent</div><div class="s-v">${money(spend)}</div></div>
        <div class="stat"><div class="s-l">Ratings left</div><div class="s-v">${orders.filter(b => b.rating).length}</div></div>
      </div>
      ${orders.length ? `<div class="tbl-wrap"><table class="tbl" style="min-width:0">
        <thead><tr><th>Order</th><th>Service</th><th>Cleaner</th><th>When</th><th class="num">Total</th></tr></thead>
        <tbody>${orders.map(b => { const cl = cleaner(b.cleaner);
          return `<tr><td class="t-strong">${b.id}<div class="t-sub">${STATUS[b.status].label}</div></td>
            <td>${svcOf(b.service).name}</td><td>${cl ? cl.name : '—'}</td>
            <td>${fmtDate(b.date)}</td><td class="num">${money(priceBooking(b).total)}</td></tr>`; }).join('')}
      </tbody></table></div>` : `<div class="mini">No orders yet.</div>`}`,
    actions:[{ label:'Close', cls:'btn-primary' }] });
}

/* ---------- outbox ---------- */
function vOutbox(){
  if(!SENT.length) return `<div class="card panel"><div class="empty">${ico('mail',40,1.4)}
    <div class="e-t">Nothing sent yet</div>
    <div>Approve or decline a registration, or place an order on the website, and the message lands here.</div></div></div>`;
  return `<div class="rows">${SENT.map((m, i) => `<div class="row-card">
      ${ico(m.channel === 'sms' ? 'chat' : 'mail', 20, 1.8)}
      <div class="rc-main"><div class="rc-t">${esc(m.subject || 'SMS')}</div>
        <div class="rc-s">To ${esc(m.to)} · ${m.at}</div></div>
      <div class="rc-act"><button class="btn btn-outline sm" data-sent="${i}">Read</button></div>
    </div>`).join('')}</div>`;
}

/* ---------- wiring ---------- */
function wire(){
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
  document.querySelectorAll('[data-order]').forEach(r => r.onclick = () => showOrder(r.dataset.order));
  document.querySelectorAll('[data-form]').forEach(b => b.onclick = e => { e.stopPropagation(); showForm(b.dataset.form); });
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => approve(b.dataset.approve));
  document.querySelectorAll('[data-decline]').forEach(b => b.onclick = () => declineFlow(b.dataset.decline));
  document.querySelectorAll('[data-staff]').forEach(b => b.onclick = () => showStaff(b.dataset.staff));
  document.querySelectorAll('[data-cust]').forEach(b => b.onclick = () => showCust(b.dataset.cust));
  document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => { roleFilter = b.dataset.role; render(); });
  document.querySelectorAll('[data-sent]').forEach(b => b.onclick = () => {
    const m = SENT[+b.dataset.sent];
    modal({ title:m.channel === 'sms' ? 'SMS' : 'Email', sub:`To ${esc(m.to)}`, wide:true,
      body:`<div class="mailer"><div class="mail-hd">
          <div><span class="mail-lbl">To</span> ${esc(m.to)}</div>
          ${m.subject ? `<div><span class="mail-lbl">Subject</span> ${esc(m.subject)}</div>` : ''}
        </div><div class="mail-bd">${m.body}</div></div>`,
      actions:[{ label:'Close', cls:'btn-primary' }] });
  });

  const s = document.getElementById('custSearch');
  if(s){
    s.oninput = () => {
      custQ = s.value;
      const pos = s.selectionStart;
      render();
      const el = document.getElementById('custSearch');
      el.focus(); el.setSelectionRange(pos, pos);
    };
  }
  document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () =>
    toast('Downloading ' + b.dataset.dl, 'download'));
}

app().innerHTML = shell();
render();
</script>
</body>
</html>
