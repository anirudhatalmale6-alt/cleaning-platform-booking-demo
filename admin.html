<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparrow — Admin dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .split{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
  @media(max-width:1000px){.split{grid-template-columns:1fr}}
  .assign-card{border:1.5px solid var(--ink-14);border-radius:var(--radius);padding:13px;cursor:pointer;background:transparent;width:100%;text-align:left;font:inherit;color:inherit;transition:.18s var(--ease);display:flex;gap:12px;align-items:center;margin-bottom:9px}
  .assign-card:hover{border-color:var(--moss)}
  .assign-card.on{border-color:var(--moss);background:var(--moss-soft)}
  .assign-card .radio{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--ink-14);flex:0 0 auto;display:grid;place-items:center;margin-left:auto}
  .assign-card.on .radio{border-color:var(--moss)}
  .assign-card.on .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--moss)}
  .best{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#332800;padding:2px 8px;border-radius:999px}
  .bars{display:grid;gap:9px}
  .bar-row{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:13px}
  .bar{height:9px;border-radius:999px;background:var(--ink-08);overflow:hidden}
  .bar span{display:block;height:100%;background:var(--moss);border-radius:999px}
  .bar.clay span{background:var(--clay)}
  .searchbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .searchbar .sb-in{position:relative;flex:1;min-width:200px}
  .searchbar .sb-in svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-45)}
  .searchbar input{width:100%;border:1.5px solid var(--ink-14);background:var(--paper-2);border-radius:11px;padding:10px 13px 10px 36px;font:inherit;font-size:14px}
  .searchbar input:focus{outline:none;border-color:var(--moss);box-shadow:0 0 0 4px rgba(44,85,72,.10)}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:7px 16px;font-size:14px}
  @media(max-width:520px){.kv{grid-template-columns:1fr;gap:2px 0}.kv dt{margin-top:9px}}
  .kv dt{color:var(--ink-45);font-size:13px}
  .kv dd{margin:0;font-weight:500}
</style>
</head>
<body>

<main class="wrap shell">
  <aside class="card side"><div class="side-nav" id="sideNav"></div></aside>
  <section id="view"></section>
</main>

<script src="assets/app.js"></script>
<script>
mountChrome({
  page:'admin.html', role:'Admin',
  links:[['admin.html','Dashboard'],['admin.html','Bookings'],['index.html','Website']]
});

const ADMIN = { name:'Lebo', surname:'Ndlovu', initials:'LN', role:'Operations manager' };

const pending   = () => DB.bookings.filter(b => b.status === 'pending');
const upcoming  = () => DB.bookings.filter(b => ['confirmed','enroute','inprogress'].includes(b.status));
const history   = () => DB.bookings.filter(b => ['completed','cancelled'].includes(b.status));
const candidates= () => DB.cleaners.filter(c => c.status === 'pending');
const groupOf   = b => (svcOf(b.service) || {}).group;

let view = 'overview', sub = null;

const NAV = () => ([
  { id:'overview',  label:'Overview',        icon:'grid' },
  { id:'services',  label:'View services',   icon:'cal' },
  { id:'confirm',   label:'Confirm bookings',icon:'check', badge: pending().length },
  { id:'candidates',label:'Candidates',      icon:'users', badge: candidates().length },
  { id:'customers', label:'Customers',       icon:'user' },
  { id:'upload',    label:'Upload new worker',icon:'upload' },
  { id:'notifs',    label:'Notifications',   icon:'bell', badge:3 }
]);

function go(v, s){
  view = v; sub = s || null;
  sideNav(NAV(), v, go);
  render();
  window.scrollTo({ top:0, behavior:'smooth' });
}
function render(){
  $('#view').innerHTML = VIEWS[view]();
  if(view === 'upload') fillCities();   // populate the city list for the default province
}

/* ---------- shared fragments ---------- */
function bookingRow(b, opts = {}){
  const q = priceBooking(b), cl = cleaner(b.cleaner), cu = custOf(b.cust), ad = address(b.addr);
  return `<tr>
    <td class="t-strong mono">${b.id}</td>
    <td>${fmtDate(b.date)}<div class="t-sub">${b.time}</div></td>
    <td>${q.serviceName}<div class="t-sub">${q.hoursLabel} · ${groupOf(b)}</div></td>
    <td><div class="who"><span class="avatar sm ${cu.tone}">${cu.initials}</span>
      <span><span class="w-n">${cu.name}</span><span class="w-s">${ad.suburb}</span></span></div></td>
    <td>${cl ? `<div class="who"><span class="avatar sm ${cl.tone}">${cl.initials}</span><span class="w-n">${cl.name} ${cl.surname}</span></div>`
             : '<span class="pill wait">Unassigned</span>'}</td>
    <td>${statusPill(b.status)}</td>
    <td class="num">${money(q.total)}</td>
    ${opts.action ? `<td class="num">${opts.action(b)}</td>` : ''}
  </tr>`;
}
function bookingTable(list, opts = {}){
  if(!list.length) return `<div class="card panel"><div class="empty">${ico('cal',32)}<div class="e-t">${opts.empty || 'Nothing here'}</div></div></div>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Booking</th><th>When</th><th>Service</th><th>Customer</th><th>Professional</th><th>Status</th><th class="num">Value</th>${opts.action ? '<th></th>' : ''}</tr></thead>
    <tbody>${list.map(b => bookingRow(b, opts)).join('')}</tbody></table></div>`;
}

/* ---------- views ---------- */
const VIEWS = {

overview(){
  const rev = DB.bookings.filter(b => b.status !== 'cancelled')
                         .reduce((s,b) => s + priceBooking(b).total, 0);
  const bars = [
    ['Indoor',  DB.bookings.filter(b => groupOf(b) === 'indoor').length],
    ['Outdoor', DB.bookings.filter(b => groupOf(b) === 'outdoor').length]
  ];
  const maxB = Math.max(...bars.map(b => b[1]));

  return `
  <div class="page-head" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
    <div class="avatar lg">${ADMIN.initials}</div>
    <div>
      <h1>Welcome back, ${ADMIN.name}</h1>
      <p>${ADMIN.role} · ${pending().length} booking${pending().length === 1 ? '' : 's'} waiting on you</p>
    </div>
  </div>

  <div class="stats" style="margin-bottom:22px">
    <div class="stat"><div class="s-l">Awaiting confirmation</div><div class="s-v mono">${pending().length}</div><div class="s-d ${pending().length ? 'down' : 'up'}">${pending().length ? 'Needs assigning' : 'All clear'}</div></div>
    <div class="stat"><div class="s-l">Upcoming jobs</div><div class="s-v mono">${upcoming().length}</div><div class="s-d">Assigned and confirmed</div></div>
    <div class="stat"><div class="s-l">Active cleaners</div><div class="s-v mono">${DB.cleaners.filter(c => c.status === 'active').length}</div><div class="s-d">${candidates().length} awaiting approval</div></div>
    <div class="stat"><div class="s-l">Booked value</div><div class="s-v mono">${money(rev)}</div><div class="s-d">incl. VAT</div></div>
  </div>

  <div class="sect-head"><h2>Quick actions</h2></div>
  <div class="qa-grid" style="margin-bottom:24px">
    <button class="qa" onclick="go('services','indoor')">${ico('home',22)}<div><div class="q-t">Indoor cleaning</div><div class="q-s">Upcoming &amp; history</div></div></button>
    <button class="qa" onclick="go('services','outdoor')">${ico('leaf',22)}<div><div class="q-t">Outdoor cleaning</div><div class="q-s">Upcoming &amp; history</div></div></button>
    <button class="qa" onclick="go('confirm')">${ico('check',22)}<div><div class="q-t">Confirm bookings</div><div class="q-s">${pending().length} waiting</div></div></button>
    <button class="qa" onclick="go('candidates')">${ico('users',22)}<div><div class="q-t">Candidates</div><div class="q-s">${candidates().length} new applications</div></div></button>
    <button class="qa" onclick="go('customers')">${ico('user',22)}<div><div class="q-t">Customers</div><div class="q-s">${DB.customers.length} profiles</div></div></button>
    <button class="qa" onclick="go('upload')">${ico('upload',22)}<div><div class="q-t">Upload new worker</div><div class="q-s">Add a cleaner manually</div></div></button>
  </div>

  <div class="split">
    <div>
      <div class="sect-head"><h2>Needs your attention</h2>
        <span class="sh-act"><button class="pill-btn sm" onclick="go('confirm')">Go to queue</button></span></div>
      ${bookingTable(pending(), {
        empty:'Every booking is confirmed',
        action: b => `<button class="btn btn-primary sm" onclick="assignFlow('${b.id}')">Confirm &amp; assign</button>`
      })}
    </div>
    <div>
      <div class="card panel" style="margin-bottom:16px">
        <div class="sect-head" style="margin-bottom:12px"><h2 style="font-size:19px">Indoor vs outdoor</h2></div>
        <div class="bars">${bars.map(([l,v],i) => `<div class="bar-row">
          <span class="t-sub">${l}</span>
          <span class="bar ${i ? 'clay' : ''}"><span style="width:${(v/maxB*100).toFixed(0)}%"></span></span>
          <span class="mono" style="text-align:right;font-weight:600">${v}</span></div>`).join('')}</div>
      </div>
      <div class="card panel">
        <div class="sect-head" style="margin-bottom:12px"><h2 style="font-size:19px">Top cleaners</h2></div>
        <div class="rows">
          ${DB.cleaners.filter(c => c.status === 'active').sort((a,b) => b.jobs - a.jobs).slice(0,4)
            .map(c => `<div style="display:flex;gap:11px;align-items:center">
              <span class="avatar sm ${c.tone}">${c.initials}</span>
              <span style="flex:1"><span class="w-n">${c.name} ${c.surname}</span>
                <span class="w-s" style="display:block">${c.jobs} cleans · ${c.rating.toFixed(2)} ★</span></span>
              <span class="mono t-sub">${money(c.earnings)}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
},

services(){
  const g = sub || 'indoor';
  const inGroup = list => list.filter(b => groupOf(b) === g);
  return `
  <div class="page-head"><h1>View services</h1><p>Bookings split by indoor and outdoor, exactly as your document lays it out.</p></div>
  <div class="tabs" style="margin-bottom:18px">
    <button class="tab ${g === 'indoor' ? 'on' : ''}" onclick="go('services','indoor')">Indoor cleaning</button>
    <button class="tab ${g === 'outdoor' ? 'on' : ''}" onclick="go('services','outdoor')">Outdoor cleaning</button>
  </div>

  <div class="sect-head"><h2>Upcoming bookings</h2><span class="sh-sub">${inGroup(upcoming()).length + inGroup(pending()).length} scheduled</span></div>
  <div style="margin-bottom:26px">${bookingTable(inGroup(pending()).concat(inGroup(upcoming())), {
    empty:`No upcoming ${g} bookings`,
    action: b => b.status === 'pending'
      ? `<button class="btn btn-primary sm" onclick="assignFlow('${b.id}')">Confirm &amp; assign</button>`
      : `<button class="btn btn-outline sm" onclick="viewBooking('${b.id}')">View</button>`
  })}</div>

  <div class="sect-head"><h2>Booking history</h2><span class="sh-sub">${inGroup(history()).length} past</span></div>
  ${bookingTable(inGroup(history()), {
    empty:`No ${g} history yet`,
    action: b => `<button class="btn btn-outline sm" onclick="viewBooking('${b.id}')">View</button>`
  })}`;
},

confirm(){
  return `
  <div class="page-head"><h1>Confirm bookings</h1><p>Every paid booking lands here first. Confirm it and assign a worker, or reject it back to the customer.</p></div>
  ${pending().length ? '' : `<div class="note">${ico('check',17,2.2)}<span>Queue is clear. Every booking has a professional assigned.</span></div>`}
  ${bookingTable(pending(), {
    empty:'Nothing waiting — every booking is confirmed and assigned',
    action: b => `<button class="btn btn-primary sm" onclick="assignFlow('${b.id}')">Confirm &amp; assign</button>
                  <button class="btn btn-ghost sm" style="color:var(--clay)" onclick="rejectBooking('${b.id}')">Reject</button>`
  })}

  <div class="sect-head" style="margin-top:28px"><h2>Confirmed &amp; assigned</h2></div>
  ${bookingTable(upcoming(), {
    empty:'Nothing assigned yet',
    action: b => `<button class="btn btn-outline sm" onclick="assignFlow('${b.id}')">Reassign</button>`
  })}`;
},

candidates(){
  const g = sub || 'indoor';
  const list = DB.cleaners.filter(c => c.group === g);
  const news = candidates().filter(c => c.group === g);
  const card = c => `<div class="row-card">
    <span class="avatar ${c.tone}">${c.initials}</span>
    <div class="rc-main">
      <div class="rc-t">${c.name} ${c.surname} ${c.status === 'pending' ? '<span class="pill wait" style="margin-left:6px">New application</span>' : ''}</div>
      <div class="rc-s">${c.city}, ${c.prov} · ${c.years} years · ${c.langs.join(', ')}</div>
      <div class="rc-s">${c.status === 'active' ? `${c.jobs} cleans · ${c.rating.toFixed(2)} ★ · earned ${money(c.earnings)}` : 'Documents awaiting verification'}</div>
    </div>
    <div class="rc-act">
      <button class="btn btn-outline sm" onclick="viewCleaner('${c.id}')">Profile</button>
      ${c.status === 'pending'
        ? `<button class="btn btn-primary sm" onclick="approveCleaner('${c.id}')">Approve</button>
           <button class="btn btn-ghost sm" style="color:var(--clay)" onclick="rejectCleaner('${c.id}')">Reject</button>`
        : `<span class="pill ok">Active</span>`}
    </div>
  </div>`;

  return `
  <div class="page-head"><h1>Candidates</h1><p>Every worker profile, split by the work they do.</p></div>
  <div class="tabs" style="margin-bottom:18px">
    <button class="tab ${g === 'indoor' ? 'on' : ''}" onclick="go('candidates','indoor')">Indoor cleaners</button>
    <button class="tab ${g === 'outdoor' ? 'on' : ''}" onclick="go('candidates','outdoor')">Outdoor cleaners</button>
  </div>
  ${news.length ? `<div class="sect-head"><h2>Awaiting approval</h2><span class="sh-sub">${news.length} new</span></div>
    <div class="rows" style="margin-bottom:26px">${news.map(card).join('')}</div>` : ''}
  <div class="sect-head"><h2>All ${g} cleaners</h2><span class="sh-sub">${list.length} profiles</span></div>
  <div class="rows">${list.filter(c => c.status === 'active').map(card).join('') || `<div class="card panel"><div class="empty">${ico('users',32)}<div class="e-t">No active ${g} cleaners yet</div></div></div>`}</div>`;
},

customers(){
  return `
  <div class="page-head"><h1>Customers</h1><p>Profiles, favourite cleaner and booking history.</p></div>
  <div class="searchbar">
    <span class="sb-in">${ico('search',17)}<input id="custQ" placeholder="Search by name, email or phone" oninput="filterCust(this.value)"></span>
    <button class="btn btn-outline sm" onclick="toast('CSV export queued','doc')">Export CSV</button>
  </div>
  <div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Customer</th><th>Contact</th><th>Favourite cleaner</th><th class="num">Bookings</th><th class="num">Lifetime spend</th><th>Joined</th><th></th></tr></thead>
    <tbody id="custBody">${DB.customers.map(custRow).join('')}</tbody>
  </table></div>`;
},

upload(){
  const g = sub || 'indoor';
  return `
  <div class="page-head"><h1>Upload new worker</h1><p>For cleaners you recruit off-platform. They appear immediately as an active professional.</p></div>
  <div class="tabs" style="margin-bottom:18px">
    <button class="tab ${g === 'indoor' ? 'on' : ''}" onclick="go('upload','indoor')">Indoor cleaner</button>
    <button class="tab ${g === 'outdoor' ? 'on' : ''}" onclick="go('upload','outdoor')">Outdoor cleaner</button>
  </div>
  <div class="split">
    <div class="card panel">
      <div class="grid2">
        <div class="field"><label>Name <span class="req">*</span></label><input id="wName" placeholder="Precious"><div class="err">Required</div></div>
        <div class="field"><label>Surname <span class="req">*</span></label><input id="wSur" placeholder="Sithole"><div class="err">Required</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Age <span class="req">*</span></label><input id="wAge" type="number" min="18" max="75" placeholder="34"><div class="err">Must be 18 or older</div></div>
        <div class="field"><label>Phone number <span class="req">*</span></label><input id="wTel" placeholder="+27 82 000 0000"><div class="err">Required</div></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Province</label>
          <select id="wProv" onchange="fillCities()">${Object.keys(CFG.provinces).map(p => `<option>${p}</option>`).join('')}</select></div>
        <div class="field"><label>City</label><select id="wCity"></select></div>
      </div>
      <div class="field"><label>Photo <span class="req">*</span></label>
        <div class="drop" id="wDrop" onclick="workerPhoto()">${ico('user',24)}
          <div class="d-t">Upload head and shoulders photo</div>
          <div class="d-s">Shown to customers when assigned</div></div>
        <div class="err">A photo is required</div>
      </div>
      <button class="btn btn-primary" style="margin-top:8px" onclick="saveWorker('${g}')">Add ${g} cleaner</button>
    </div>
    <div class="card panel">
      <div class="sect-head" style="margin-bottom:10px"><h2 style="font-size:19px">Recently added</h2></div>
      <div class="rows">
        ${DB.cleaners.slice(-4).reverse().map(c => `<div style="display:flex;gap:11px;align-items:center">
          <span class="avatar sm ${c.tone}">${c.initials}</span>
          <span style="flex:1"><span class="w-n">${c.name} ${c.surname}</span>
            <span class="w-s" style="display:block">${c.group} · ${c.city}</span></span>
          <span class="pill ${c.status === 'active' ? 'ok' : 'wait'}">${c.status === 'active' ? 'Active' : 'Pending'}</span>
        </div>`).join('')}
      </div>
      <div class="note">${ico('info',17,2)}<span>Your document lists Indoor cleaner twice under this heading. I have read the second one as Outdoor — say the word if it was meant to be something else.</span></div>
    </div>
  </div>`;
},

notifs(){
  const items = [
    { t:`${pending().length} bookings are waiting for confirmation`, s:'Oldest has been waiting 3 hours', k:'wait' },
    { t:`${candidates().length} cleaner applications need review`, s:'Documents uploaded, references not yet called', k:'wait' },
    { t:'Nomsa Mabaso completed SPW-103980', s:'Rated 5 stars by Thandi Mokoena · yesterday', k:'ok' },
    { t:'Payout run scheduled for Friday 21 Aug', s:`${money(14820)} across 9 cleaners`, k:'live' },
    { t:'Booking SPW-103551 was cancelled', s:'Free cancellation window · no charge', k:'bad' }
  ];
  return `
  <div class="page-head" style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">
    <div><h1>Notifications</h1><p>Operational alerts across the platform.</p></div>
    <button class="btn btn-ghost sm" style="margin-left:auto" onclick="toast('All marked as read','check')">Mark all read</button>
  </div>
  <div class="rows">${items.map(n => `<div class="row-card">
    <span class="pill ${n.k}" style="padding:5px;border-radius:50%"></span>
    <div class="rc-main"><div class="rc-t">${n.t}</div><div class="rc-s">${n.s}</div></div>
  </div>`).join('')}</div>`;
}
};

function custRow(c){
  return `<tr>
    <td><div class="who"><span class="avatar sm ${c.tone}">${c.initials}</span>
      <span><span class="w-n">${c.name}</span><span class="w-s">${c.id.toUpperCase()}</span></span></div></td>
    <td>${c.email}<div class="t-sub">${c.phone}</div></td>
    <td>${c.fav}</td>
    <td class="num">${c.bookings}</td>
    <td class="num">${money(c.spend)}</td>
    <td>${c.joined}</td>
    <td class="num"><button class="btn btn-outline sm" onclick="viewCustomer('${c.id}')">Profile</button></td>
  </tr>`;
}
function filterCust(q){
  q = q.trim().toLowerCase();
  const hits = DB.customers.filter(c =>
    !q || c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.phone.includes(q));
  $('#custBody').innerHTML = hits.length
    ? hits.map(custRow).join('')
    : `<tr><td colspan="7"><div class="empty" style="padding:26px">${ico('search',28)}<div class="e-t">No customer matches “${q}”</div></div></td></tr>`;
}

/* ============================================================
   THE CORE ADMIN FLOW — confirm a booking and assign a worker.
   Candidates are filtered to cleaners who do that kind of work
   and cover that city; the best match is suggested, never forced.
   ============================================================ */
function assignFlow(id){
  const b = DB.bookings.find(x => x.id === id);
  const q = priceBooking(b), ad = address(b.addr), cu = custOf(b.cust);
  const want = groupOf(b);

  const eligible = DB.cleaners
    .filter(c => c.status === 'active' && c.group === want && c.city === ad.city)
    .sort((x,y) => y.rating - x.rating);
  const favName = cu.fav;
  let picked = b.cleaner || (eligible[0] && eligible[0].id) || null;

  const body = `
    <dl class="kv" style="margin-bottom:16px">
      <dt>Service</dt><dd>${q.serviceName} · ${q.hoursLabel}</dd>
      <dt>When</dt><dd>${fmtDateLong(b.date)} at ${b.time}</dd>
      <dt>Customer</dt><dd>${cu.name}</dd>
      <dt>Address</dt><dd>${ad.line}, ${ad.suburb}</dd>
      <dt>Value</dt><dd class="mono">${money(q.total)} incl. VAT</dd>
    </dl>
    <div class="fieldset-t">Assign ${want === 'outdoor' ? 'an' : 'a'} ${want} cleaner in ${ad.city}</div>
    <div id="assignList">
      ${eligible.length ? eligible.map((c,i) => `
        <button class="assign-card ${c.id === picked ? 'on' : ''}" data-cl="${c.id}">
          <span class="avatar sm ${c.tone}">${c.initials}</span>
          <span style="flex:1">
            <span class="w-n">${c.name} ${c.surname}
              ${`${c.name} ${c.surname}` === favName ? '<span class="best" style="background:var(--clay);color:#fff">Customer favourite</span>' : (i === 0 ? '<span class="best">Best match</span>' : '')}
            </span>
            <span class="w-s">${c.rating.toFixed(2)} ★ · ${c.jobs} cleans · ${c.city}</span>
          </span>
          <span class="radio"></span>
        </button>`).join('')
        : `<div class="empty" style="padding:22px">${ico('users',28)}
             <div class="e-t">No ${want} cleaner covers ${ad.city}</div>
             <div>Approve a candidate for this area, or add a worker manually.</div></div>`}
    </div>`;

  const v = modal({
    title: b.cleaner ? 'Reassign booking' : 'Confirm booking',
    sub: `${b.id} · currently ${STATUS[b.status].label.toLowerCase()}`,
    body,
    actions:[
      { label:'Close', cls:'btn-outline' },
      { label: b.cleaner ? 'Reassign' : 'Confirm & assign', cls:'btn-primary', fn(){
          if(!picked){ toast('Pick a cleaner first','info'); return true; }
          b.cleaner = picked;
          b.status = 'confirmed';
          b.eta = b.time;
          const c = cleaner(picked);
          toast(`${b.id} assigned to ${c.name} ${c.surname}`,'check');
          go(view, sub);
        } }
    ]
  });
  v.querySelectorAll('[data-cl]').forEach(el => el.onclick = () => {
    picked = el.dataset.cl;
    v.querySelectorAll('[data-cl]').forEach(x => x.classList.toggle('on', x === el));
  });
}

function rejectBooking(id){
  const b = DB.bookings.find(x => x.id === id);
  modal({
    title:'Reject this booking?',
    sub:`${b.id} · ${fmtDate(b.date)} at ${b.time}`,
    body:`<p style="margin:0 0 12px;color:var(--ink-70)">The customer is notified and the authorised payment is released, not captured.</p>
          <div class="field"><label>Reason sent to the customer</label>
            <select><option>No cleaner available in that area</option><option>Outside our service area</option><option>Requested time not possible</option><option>Other</option></select></div>`,
    actions:[
      { label:'Keep it', cls:'btn-outline' },
      { label:'Reject booking', cls:'btn-danger', fn(){
          b.status = 'cancelled'; b.cleaner = null;
          toast('Booking rejected and customer notified','check'); go(view, sub);
        } }
    ]
  });
}

function viewBooking(id){
  const b = DB.bookings.find(x => x.id === id);
  const q = priceBooking(b), cl = cleaner(b.cleaner), cu = custOf(b.cust), ad = address(b.addr);
  const items = (b.extras || []).map(x => CFG.checklist.find(c => c.id === x)).filter(Boolean);
  modal({
    title:q.serviceName, sub:`${b.id} · ${STATUS[b.status].label}`,
    body:`<dl class="kv">
        <dt>Date &amp; time</dt><dd>${fmtDateLong(b.date)} at ${b.time}</dd>
        <dt>Duration</dt><dd>${q.hoursLabel}</dd>
        <dt>Frequency</dt><dd>${q.freqLabel}</dd>
        <dt>Customer</dt><dd>${cu.name} · ${cu.phone}</dd>
        <dt>Address</dt><dd>${ad.line}, ${ad.suburb}</dd>
        <dt>Access notes</dt><dd>${ad.notes}</dd>
        <dt>Professional</dt><dd>${cl ? `${cl.name} ${cl.surname}` : 'Unassigned'}</dd>
      </dl>
      ${items.length ? `<div class="fieldset-t">Checklist</div><div class="chips">${items.map(i => `<span class="chip on">${i.name}</span>`).join('')}</div>` : ''}
      <div class="fieldset-t">Money</div>
      <div class="li"><span>Service fee</span><span class="v mono">${money(q.base)}</span></div>
      <div class="li"><span>Extras</span><span class="v mono">${money(q.extras)}</span></div>
      <div class="li ${q.discount ? 'disc' : ''}"><span>Discount</span><span class="v mono">${q.discount ? '−' + money(q.discount) : money(0)}</span></div>
      <div class="li"><span>Platform fee</span><span class="v mono">${money(q.fee)}</span></div>
      <div class="li"><span>VAT (${(CFG.vatRate*100).toFixed(0)}%)</span><span class="v mono">${money(q.vat)}</span></div>
      <div class="rule"></div>
      <div class="total"><span class="t-l">Total</span><span class="t-v mono">${money(q.total)}</span></div>`,
    actions:[{ label:'Close', cls:'btn-outline' }]
  });
}

function viewCleaner(id){
  const c = cleaner(id);
  modal({
    title:`${c.name} ${c.surname}`, sub:`${c.group} cleaner · ${c.status === 'active' ? 'Active' : 'Awaiting approval'}`,
    body:`<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
        <span class="avatar lg ${c.tone}">${c.initials}</span>
        <div><div class="stars">${starRow(c.rating)} <span class="t-sub" style="letter-spacing:0">${c.rating ? c.rating.toFixed(2) : 'not yet rated'}</span></div>
        <div class="t-sub">${c.jobs} cleans · ${c.years} years experience</div></div>
      </div>
      <dl class="kv">
        <dt>Works in</dt><dd>${c.city}, ${c.prov}</dd>
        <dt>Languages</dt><dd>${c.langs.join(', ')}</dd>
        <dt>Total earned</dt><dd class="mono">${money(c.earnings)}</dd>
      </dl>
      <div class="fieldset-t">Documents</div>
      <div class="li"><span>ID / passport / permit</span><span class="pill ${c.status === 'active' ? 'ok' : 'wait'}">${c.status === 'active' ? 'Verified' : 'Uploaded'}</span></div>
      <div class="li"><span>Head &amp; shoulders photo</span><span class="pill ${c.status === 'active' ? 'ok' : 'wait'}">${c.status === 'active' ? 'Verified' : 'Uploaded'}</span></div>
      <div class="li"><span>References</span><span class="pill ${c.status === 'active' ? 'ok' : 'wait'}">${c.status === 'active' ? '2 of 2 called' : 'Not called'}</span></div>
      <div class="li"><span>Criminal record declared</span><span class="pill ${c.status === 'active' ? 'ok' : 'mute'}">${c.status === 'active' ? 'None · clearance valid' : 'Pending check'}</span></div>`,
    actions: c.status === 'pending'
      ? [{ label:'Close', cls:'btn-outline' }, { label:'Approve cleaner', cls:'btn-primary', fn(){ approveCleaner(id); } }]
      : [{ label:'Close', cls:'btn-outline' }]
  });
}

function approveCleaner(id){
  const c = cleaner(id);
  c.status = 'active';
  toast(`${c.name} ${c.surname} approved — can now be assigned`,'check');
  go('candidates', c.group);
}
function rejectCleaner(id){
  const c = cleaner(id);
  modal({
    title:`Reject ${c.name} ${c.surname}?`,
    sub:'The applicant is notified by SMS',
    body:`<div class="field"><label>Reason</label><select>
        <option>Documents could not be verified</option>
        <option>References did not check out</option>
        <option>No demand in that area right now</option>
        <option>Other</option></select></div>`,
    actions:[
      { label:'Keep', cls:'btn-outline' },
      { label:'Reject application', cls:'btn-danger', fn(){
          DB.cleaners.splice(DB.cleaners.findIndex(x => x.id === id), 1);
          toast('Application rejected','check'); go('candidates', c.group);
        } }
    ]
  });
}

function viewCustomer(id){
  const c = custOf(id);
  const theirs = DB.bookings.filter(b => b.cust === id);
  modal({
    title:c.name, sub:`${c.id.toUpperCase()} · joined ${c.joined}`,
    body:`<dl class="kv">
        <dt>Email</dt><dd>${c.email}</dd>
        <dt>Phone</dt><dd>${c.phone}</dd>
        <dt>Favourite cleaner</dt><dd>${c.fav}</dd>
        <dt>Total bookings</dt><dd class="mono">${c.bookings}</dd>
        <dt>Lifetime spend</dt><dd class="mono">${money(c.spend)}</dd>
      </dl>
      <div class="fieldset-t">Booking history</div>
      ${theirs.length ? theirs.map(b => {
        const q = priceBooking(b), cl = cleaner(b.cleaner);
        return `<div class="li"><span>${fmtDate(b.date)} · ${q.serviceName}<br>
          <span class="t-sub">${b.id} · ${cl ? cl.name : 'unassigned'}</span></span>
          <span class="v mono">${money(q.total)}<br>${statusPill(b.status)}</span></div>`;
      }).join('') : '<p class="t-sub">No bookings on this profile yet.</p>'}`,
    actions:[{ label:'Close', cls:'btn-outline' }]
  });
}

/* ---------- upload new worker ---------- */
let workerPic = null;
function fillCities(){
  const p = $('#wProv').value;
  $('#wCity').innerHTML = CFG.provinces[p].map(c => `<option>${c}</option>`).join('');
}
function workerPhoto(){
  workerPic = 'worker.jpg';
  const el = $('#wDrop');
  el.classList.add('filled');
  el.innerHTML = `${ico('doc',22)}<div><div class="d-t">worker.jpg</div><div class="d-s">Uploaded · tap to replace</div></div>`;
  el.closest('.field').classList.remove('bad');
}
function saveWorker(group){
  const f = (sel, cond) => { const el = $(sel); el.closest('.field').classList.toggle('bad', cond); return cond; };
  let fail = false;
  fail |= f('#wName', !$('#wName').value.trim());
  fail |= f('#wSur',  !$('#wSur').value.trim());
  fail |= f('#wAge',  !($('#wAge').value >= 18 && $('#wAge').value <= 75));
  fail |= f('#wTel',  $('#wTel').value.replace(/\D/g,'').length < 9);
  fail |= f('#wDrop', !workerPic);
  if(fail){ toast('Please complete the highlighted fields','info'); return; }

  const name = $('#wName').value.trim(), sur = $('#wSur').value.trim();
  DB.cleaners.push({
    id:'cl' + (DB.cleaners.length + 1), name, surname:sur,
    initials:(name[0] + sur[0]).toUpperCase(),
    rating:0, jobs:0, years:0, langs:['English'], group,
    city:$('#wCity').value, prov:$('#wProv').value,
    status:'active', fav:false, tone:['','sky','clay','gold'][DB.cleaners.length % 4], earnings:0
  });
  workerPic = null;
  toast(`${name} ${sur} added as a ${group} cleaner`,'check');
  go('upload', group);
}

go('overview');
</script>
