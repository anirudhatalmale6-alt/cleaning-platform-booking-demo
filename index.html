<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparrow — home and office cleaning, booked in minutes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* ---------- landing ---------- */
  .hero{padding:56px 0 34px}
  .hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
  @media(max-width:940px){.hero .wrap{grid-template-columns:1fr;gap:28px}.hero{padding:34px 0 22px}}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--moss);font-weight:700;margin-bottom:14px}
  .hero h1{font-size:clamp(38px,5.6vw,62px);line-height:1.02}
  .hero h1 em{font-style:italic;color:var(--moss)}
  .hero p.lede{font-size:17px;color:var(--ink-70);max-width:46ch;margin:18px 0 26px}
  .hero-cta{display:flex;gap:11px;flex-wrap:wrap}
  .trust{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap}
  .trust .t-v{font-family:'Fraunces',serif;font-size:25px}
  .trust .t-l{font-size:12.5px;color:var(--ink-45)}
  .hero-card{padding:24px 26px}
  .hero-card h3{font-size:20px;margin-bottom:4px}
  .hero-card .hc-s{font-size:13.5px;color:var(--ink-45);margin-bottom:16px}

  .band{padding:36px 0}
  .band-t{font-size:28px;margin-bottom:6px}
  .band-s{color:var(--ink-45);font-size:14.5px;margin-bottom:20px}
  .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
  @media(max-width:820px){.svc-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:480px){.svc-grid{grid-template-columns:1fr}}
  .svc{border:1.5px solid var(--ink-14);border-radius:var(--radius);padding:18px 16px;background:var(--paper-2);cursor:pointer;font:inherit;color:inherit;text-align:left;transition:.22s var(--ease);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .svc:hover{border-color:var(--moss);transform:translateY(-2px);box-shadow:var(--shadow-1)}
  .svc svg{color:var(--moss)}
  .svc .s-t{font-weight:600;font-size:15px}
  .svc .s-d{font-size:12.5px;color:var(--ink-45)}
  .svc .s-p{font-size:12.5px;color:var(--moss);font-weight:600;margin-top:auto}

  .steps3{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  @media(max-width:820px){.steps3{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:440px){.steps3{grid-template-columns:1fr}}
  .st3 .n{width:31px;height:31px;border-radius:50%;background:var(--ink);color:var(--paper-2);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:15px;margin-bottom:10px}
  .st3 .t{font-weight:600;margin-bottom:3px}
  .st3 .s{font-size:13px;color:var(--ink-45)}

  /* ---------- booker ---------- */
  .booker{display:grid;grid-template-columns:1fr 344px;gap:24px;align-items:start;padding:22px 0 100px}
  @media(max-width:960px){.booker{grid-template-columns:1fr;padding-bottom:96px}}
  .booker>*{min-width:0}
  .aside{position:sticky;top:88px}
  @media(max-width:960px){.aside{display:none}}
  .progline{display:flex;align-items:center;gap:7px;margin-bottom:18px;flex-wrap:wrap}
  .pg{height:4px;border-radius:3px;background:var(--ink-08);flex:1;min-width:22px;transition:.35s var(--ease)}
  .pg.on{background:var(--moss)}
  .step-t{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);margin-bottom:7px}
  .pane{animation:rise .34s var(--ease) both}
  .navrow{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}

  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(243,239,231,.96);backdrop-filter:blur(12px);border-top:1px solid var(--ink-14);padding:11px 18px;display:none;align-items:center;gap:14px}
  @media(max-width:960px){.mbar.on{display:flex}}
  .mbar .m-l{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-45)}
  .mbar .m-v{font-family:'Fraunces',serif;font-size:23px;font-variant-numeric:tabular-nums}
  .mbar .btn{margin-left:auto}

  .conf{text-align:center;padding:14px 0 6px}
  .conf .tick{width:66px;height:66px;border-radius:50%;background:var(--moss);color:#fff;display:grid;place-items:center;margin:0 auto 16px;animation:pop .5s var(--ease) both}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .conf h2{font-size:30px;margin-bottom:6px}
  .ref{font-family:'Fraunces',serif;font-size:21px;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app"></div>
<div class="mbar" id="mbar">
  <div><div class="m-l">Total</div><div class="m-v" id="mbarV">R0</div></div>
  <button class="btn btn-primary" id="mbarB" onclick="next()">Continue</button>
</div>

<script src="assets/app.js"></script>
<script>
/* ============================================================
   Booking state. One object; every screen reads and writes it.
   The step order is the client's, from his message of 19 Aug:
   service -> extras -> address -> pick a worker -> checkout.
   ============================================================ */
const B = {
  service:null, band:'b12', hours:null, extras:[],
  wash:null, finish:null,
  addr:{ type:'', line:'', unit:'', suburb:'', city:'Cape Town', prov:'Western Cape', notes:'' },
  geo:false, date:null, time:null, cleaner:null, note:'', ref:'',
  signedIn:false, guest:false
};
let route = 'home';        // home | signin | signup | book
let step  = 0;             // 0 service · 1 the job · 2 where & when · 3 worker · 4 checkout · 5 done
const STEPS = ['Service','Your job','Where & when','Choose your cleaner','Checkout'];

const app = () => document.getElementById('app');

/* ============================================================
   LANDING
   ============================================================ */
function viewHome(){
  const cheapest = priceBooking({ service:'standard', band:'b12', extras:[] }).total;
  return `
  ${protoBar('index.html')}
  <div class="topbar"><div class="wrap">
    <a class="brand" href="index.html">
      <span class="brand-mark">${ico('home',17,2).replace('currentColor','#F3EFE7')}</span>
      <span class="brand-name">Sparrow<em>.</em></span>
    </a>
    <nav class="nav">
      <a href="#services" class="hide-sm">Services</a>
      <a href="#how" class="hide-sm">How it works</a>
      <a href="cleaner.html" class="hide-sm">Work with us</a>
      <button class="pill-btn" id="navSignin">${ico('user',15,2)} Sign in</button>
    </nav>
  </div></div>

  <section class="hero"><div class="wrap">
    <div>
      <div class="eyebrow">Cape Town · Johannesburg · Durban</div>
      <h1>A clean home,<br>booked in <em>minutes</em>.</h1>
      <p class="lede">Pick your service, pick your extras, then pick the cleaner you want. Vetted, background-checked professionals — you choose the person, not a queue.</p>
      <div class="hero-cta">
        <button class="btn btn-primary" id="ctaBook">Book a clean ${ico('arrow',17,2.2)}</button>
        <button class="btn btn-outline" id="ctaGuest">Continue as guest</button>
      </div>
      <div class="trust">
        <div><div class="t-v">4.9</div><div class="t-l">Average rating</div></div>
        <div><div class="t-v">${money(cheapest)}</div><div class="t-l">From, all in</div></div>
        <div><div class="t-v">${CFG.maxHours}h</div><div class="t-l">Max cleaner day</div></div>
      </div>
    </div>
    <div class="card hero-card">
      <h3>Already with us?</h3>
      <div class="hc-s">Signed-in customers keep their addresses, see past orders and can rate the cleaners they have had.</div>
      <div style="display:grid;gap:9px">
        <button class="btn btn-primary" id="hcIn">${ico('lock',16,2)} Sign in</button>
        <button class="btn btn-outline" id="hcUp">${ico('user',16,2)} Create an account</button>
        <button class="btn btn-ghost" id="hcGuest" style="justify-content:center">Continue as guest ${ico('arrow',15,2.2)}</button>
      </div>
      <div class="note" style="margin-top:16px">${ico('info',16,2)}
        <span>Guests can book and pay. You just do not get order history, saved addresses or ratings until you make an account.</span>
      </div>
    </div>
  </div></section>

  <section class="band" id="services"><div class="wrap">
    <h2 class="band-t">What we clean</h2>
    <div class="band-s">Prices below are the full amount you pay — flat rate, hours, extras and the service fee together.</div>
    <div class="svc-grid">
      ${CFG.services.map(s => {
        const seed = s.model === 'bedrooms' ? { service:s.id, band:'b12', extras:[] }
                   : s.model === 'laundry'  ? { service:s.id, wash:'machine', finish:'dryfold', extras:[] }
                   : { service:s.id, extras:[] };
        const p = priceBooking(seed);
        return `<button class="svc" data-jump="${s.id}">
          ${ico(s.icon, 24, 1.6)}
          <div class="s-t">${s.name}</div>
          <div class="s-d">${s.desc}</div>
          <div class="s-p">From ${money(p.total)} · est ${p.hoursLabel}</div>
        </button>`;
      }).join('')}
    </div>
  </div></section>

  <section class="band" id="how"><div class="wrap">
    <h2 class="band-t">How it works</h2>
    <div class="band-s">Four screens, then you are done.</div>
    <div class="steps3">
      <div class="st3"><div class="n">1</div><div class="t">Pick the service</div><div class="s">Indoor, laundry or outdoor. We estimate the hours from your unit size.</div></div>
      <div class="st3"><div class="n">2</div><div class="t">Add your extras</div><div class="s">Oven, fridge, cupboards, laundry. Each one adds its own time.</div></div>
      <div class="st3"><div class="n">3</div><div class="t">Confirm the address</div><div class="s">We pin it on the map so your cleaner finds the door.</div></div>
      <div class="st3"><div class="n">4</div><div class="t">Choose your cleaner</div><div class="s">Everyone free in your area that day. Pick a face, leave a note, pay.</div></div>
    </div>
  </div></section>

  <footer><div class="wrap">
    <span>Sparrow — prototype build for review</span>
    <span>Pricing per the brief of 19 Aug 2026</span>
  </div></footer>`;
}

/* ============================================================
   AUTH — sign in / sign up / guest
   ============================================================ */
function viewSignin(){
  return `${protoBar('index.html')}${topBar('', [], '')}
  <div class="wrap"><div class="auth-wrap">
    <div class="auth-head"><h1>Welcome back</h1><p>Sign in to keep your addresses and order history.</p></div>
    <div class="card panel">
      <div class="field"><label for="siEmail">Email address</label>
        <input id="siEmail" type="email" value="thandi.m@example.co.za" autocomplete="email">
        <div class="err">Enter your email address</div></div>
      <div class="field"><label for="siPass">Password</label>
        <input id="siPass" type="password" value="demo1234" autocomplete="current-password">
        <div class="err">Enter your password</div></div>
      <button class="btn btn-primary" style="width:100%" id="siGo">Sign in</button>
      <div class="auth-alt">No account yet? <button id="toSignup">Create one</button></div>
      <div class="auth-or">or</div>
      <button class="btn btn-outline" style="width:100%" id="siGuest">Continue as guest</button>
    </div>
    <div class="note">${ico('info',16,2)}<span>Prototype — any email and password signs you in as Thandi, so you can see what a returning customer gets.</span></div>
  </div></div>`;
}

function viewSignup(){
  return `${protoBar('index.html')}${topBar('', [], '')}
  <div class="wrap"><div class="auth-wrap wide">
    <div class="auth-head"><h1>Create your account</h1><p>Takes a minute. Then your details are saved for next time.</p></div>
    <div class="card panel">
      <div class="grid2">
        <div class="field"><label>First name <span class="req">*</span></label><input id="suFirst" placeholder="Thandi"><div class="err">Required</div></div>
        <div class="field"><label>Surname <span class="req">*</span></label><input id="suLast" placeholder="Mokoena"><div class="err">Required</div></div>
      </div>
      <div class="field"><label>Email address <span class="req">*</span></label><input id="suEmail" type="email" placeholder="you@example.co.za"><div class="err">Enter a valid email address</div></div>
      <div class="field"><label>Mobile number <span class="req">*</span></label><input id="suPhone" placeholder="082 000 0000"><div class="err">Enter a valid South African mobile number</div></div>
      <div class="grid2">
        <div class="field"><label>Password <span class="req">*</span></label><input id="suPass" type="password" placeholder="At least 8 characters"><div class="err">At least 8 characters</div></div>
        <div class="field"><label>Confirm password <span class="req">*</span></label><input id="suPass2" type="password"><div class="err">Passwords do not match</div></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px" id="suGo">Create account</button>
      <div class="auth-alt">Already have an account? <button id="toSignin">Sign in</button></div>
    </div>
  </div></div>`;
}

/* ============================================================
   BOOKING SHELL
   ============================================================ */
function viewBook(){
  return `${protoBar('index.html')}${topBar('', [], '')}
  <div class="wrap"><div class="booker">
    <div>
      <div class="progline" id="prog"></div>
      <div class="step-t" id="stepT"></div>
      <div id="panes"></div>
    </div>
    <aside class="aside"><div class="card panel" id="sum"></div></aside>
  </div></div>`;
}

/* ---------- router ---------- */
function go(r){
  route = r;
  app().innerHTML = r === 'home' ? viewHome() : r === 'signin' ? viewSignin() : r === 'signup' ? viewSignup() : viewBook();
  document.getElementById('mbar').classList.toggle('on', r === 'book');
  window.scrollTo(0, 0);
  if(r === 'home') wireHome();
  if(r === 'signin') wireSignin();
  if(r === 'signup') wireSignup();
  if(r === 'book') render();
}

function wireHome(){
  document.getElementById('navSignin').onclick = () => go('signin');
  document.getElementById('hcIn').onclick = () => go('signin');
  document.getElementById('hcUp').onclick = () => go('signup');
  document.getElementById('ctaBook').onclick = () => go('signin');
  document.getElementById('ctaGuest').onclick = startGuest;
  document.getElementById('hcGuest').onclick = startGuest;
  document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
    B.service = b.dataset.jump; B.guest = true; seedForService(); step = 1; go('book');
  });
}
function startGuest(){ B.guest = true; B.signedIn = false; step = 0; go('book'); }

function wireSignin(){
  document.getElementById('toSignup').onclick = () => go('signup');
  document.getElementById('siGuest').onclick = startGuest;
  document.getElementById('siGo').onclick = () => {
    const em = document.getElementById('siEmail'), pw = document.getElementById('siPass');
    let bad = false;
    [[em, /\S+@\S+\.\S+/.test(em.value)], [pw, pw.value.length > 0]].forEach(([el, ok]) => {
      el.closest('.field').classList.toggle('bad', !ok); if(!ok) bad = true;
    });
    if(bad) return;
    B.signedIn = true; B.guest = false;
    B.addr = { ...DB.addresses[0] };
    B.geo = true;
    toast('Signed in as ' + DB.customer.name);
    if(!B.service) step = 0;
    go('book');
  };
}

function wireSignup(){
  document.getElementById('toSignin').onclick = () => go('signin');
  document.getElementById('suGo').onclick = () => {
    const g = id => document.getElementById(id);
    const checks = [
      [g('suFirst'), g('suFirst').value.trim().length > 1],
      [g('suLast'),  g('suLast').value.trim().length > 1],
      [g('suEmail'), /\S+@\S+\.\S+/.test(g('suEmail').value)],
      [g('suPhone'), /^(\+27|0)[6-8][0-9]{8}$/.test(g('suPhone').value.replace(/\s/g,''))],
      [g('suPass'),  g('suPass').value.length >= 8],
      [g('suPass2'), g('suPass2').value === g('suPass').value && g('suPass2').value.length >= 8]
    ];
    let bad = false;
    checks.forEach(([el, ok]) => { el.closest('.field').classList.toggle('bad', !ok); if(!ok) bad = true; });
    if(bad) return;
    B.signedIn = true; B.guest = false;
    toast('Account created — welcome to Sparrow');
    step = 0; go('book');
  };
}

/* ============================================================
   BOOKING RENDER
   ============================================================ */
function seedForService(){
  const svc = svcOf(B.service);
  if(!svc) return;
  B.extras = [];
  B.cleaner = null;
  if(svc.model === 'bedrooms'){ B.band = B.band || 'b12'; B.hours = baseHoursFor(B); }
  else if(svc.model === 'laundry'){ B.wash = null; B.finish = null; B.hours = null; }
  else { B.hours = svc.estHours; }
}

function render(){
  const prog = document.getElementById('prog');
  if(!prog) return;
  prog.innerHTML = STEPS.map((_, i) => `<span class="pg ${i <= step ? 'on' : ''}"></span>`).join('');
  document.getElementById('stepT').textContent =
    step < STEPS.length ? `Step ${step + 1} of ${STEPS.length} — ${STEPS[step]}` : 'Booked';
  document.getElementById('panes').innerHTML =
    [paneService, paneDetails, paneAddress, paneWorker, paneCheckout, paneDone][step]();
  renderSummary();
  wirePane();
}

function renderSummary(){
  const box = document.getElementById('sum');
  const bar = document.getElementById('mbarV');
  const btn = document.getElementById('mbarB');
  if(!B.service){
    box.innerHTML = `<h3 style="font-size:19px">Your booking</h3>
      <div class="mini" style="margin-top:8px">Pick a service to see the price.</div>`;
    bar.textContent = 'R0'; btn.disabled = true;
    return;
  }
  const p = priceBooking(B);
  const svc = svcOf(B.service);
  const cl = B.cleaner ? cleaner(B.cleaner) : null;
  box.innerHTML = `
    <h3 style="font-size:19px">${svc.name}</h3>
    <div class="mini" style="margin-bottom:12px">${detailLine()}</div>
    <div class="rule"></div>
    ${moneyLines(p)}
    <div class="rule"></div>
    <div class="total"><span class="t-l">Total</span><span class="t-v" id="sumTot">${money(p.total)}</span></div>
    <div class="mini" style="margin-top:4px">Estimated ${p.hoursLabel} on site</div>
    ${cl ? `<div class="rule"></div><div class="pro-line">${portrait(cl,42)}
        <div><div class="t-strong">${cl.name} ${cl.surname}</div><div class="mini">Your cleaner</div></div></div>` : ''}
    ${p.placeholder ? `<div class="note warn" style="margin-top:14px">${ico('info',16,2)}
      <span>Hours for ${svc.name.toLowerCase()} are my estimate — this service is not in your price list yet.</span></div>` : ''}`;
  bar.textContent = money(p.total);
  btn.disabled = !canAdvance();
  btn.textContent = step === 4 ? 'Pay ' + money(p.total) : 'Continue';
  btn.style.display = step === 5 ? 'none' : '';
}

function moneyLines(p){
  return `
    <div class="li"><span>Flat rate</span><span class="v">${money(p.flat)}</span></div>
    <div class="li"><span>${p.serviceHoursLabel} @ ${money(CFG.hourlyRate)}/hr</span><span class="v">${money(p.labour)}</span></div>
    ${p.extras ? `<div class="li"><span>Extra tasks</span><span class="v">${money(p.extras)}</span></div>` : ''}
    <div class="li"><span>Service fee</span><span class="v">${money(p.fee)}</span></div>`;
}

function detailLine(){
  const svc = svcOf(B.service);
  if(svc.model === 'bedrooms'){
    const band = CFG.bedroomBands.find(x => x.id === B.band);
    const ex = B.extras.length ? ` · ${B.extras.length} extra${B.extras.length > 1 ? 's' : ''}` : '';
    return `${band.label}${ex}`;
  }
  if(svc.model === 'laundry'){
    const w = CFG.laundryWash.find(x => x.id === B.wash);
    const f = CFG.laundryFinish.find(x => x.id === B.finish);
    return [w && w.name, f && f.name].filter(Boolean).join(' · ') || 'Choose a wash';
  }
  return svc.desc;
}

/* ---------- pane 0: service ---------- */
function paneService(){
  const grp = g => CFG.services.filter(s => s.group === g).map(s => `
    <button class="svc" data-svc="${s.id}" style="${B.service === s.id ? 'border-color:var(--ink);border-width:2px;background:var(--moss-soft)' : ''}">
      ${ico(s.icon, 24, 1.6)}
      <div class="s-t">${s.name}</div>
      <div class="s-d">${s.desc}</div>
    </button>`).join('');
  return `
    <div class="pane">
      <h2 style="font-size:27px;margin-bottom:4px">What do you need done?</h2>
      <div class="mini" style="margin-bottom:18px">Indoor jobs are estimated from your unit size. Outdoor jobs are estimated by the job.</div>
      <div class="fieldset-t">Indoor</div>
      <div class="svc-grid">${grp('indoor')}</div>
      <div class="fieldset-t">Outdoor</div>
      <div class="svc-grid">${grp('outdoor')}</div>
      <div class="navrow"><button class="btn btn-ghost" id="toHome">${ico('back',16,2.2)} Back</button>
        <button class="btn btn-primary spacer" id="nextBtn" ${B.service ? '' : 'disabled'}>Continue ${ico('arrow',16,2.2)}</button></div>
    </div>`;
}

/* ---------- pane 1: the job ---------- */
function paneDetails(){
  const svc = svcOf(B.service);
  return `<div class="pane">
    <h2 style="font-size:27px;margin-bottom:4px">${svc.name}</h2>
    <div class="mini" style="margin-bottom:18px">${svc.desc}</div>
    ${svc.model === 'bedrooms' ? bedroomBlock() : svc.model === 'laundry' ? laundryBlock() : hoursOnlyBlock()}
    <div class="navrow"><button class="btn btn-ghost" data-back>${ico('back',16,2.2)} Back</button>
      <button class="btn btn-primary spacer" id="nextBtn" ${canAdvance() ? '' : 'disabled'}>Continue ${ico('arrow',16,2.2)}</button></div>
  </div>`;
}

function bedroomBlock(){
  const p = priceBooking(B);
  return `
    <div class="fieldset-t">Unit size</div>
    <div class="chips">${CFG.bedroomBands.map(b => `
      <button class="chip ${B.band === b.id ? 'on' : ''}" data-band="${b.id}">${b.label}
        <span class="c-price">est ${b.hours}h</span></button>`).join('')}
    </div>
    <div class="note" style="margin-top:12px">${ico('info',16,2)}
      <span>These are just estimates for the unit size and could add more hours. Adjust below if your place needs longer.</span></div>

    <div class="fieldset-t">Hours</div>
    ${stepperBlock(p)}

    <div class="fieldset-t">Extra tasks</div>
    ${tasksBlock()}`;
}

function stepperBlock(p){
  const canDown = p.serviceHours - CFG.stepMins / 60 >= p.minHours - 1e-9;
  const canUp   = p.serviceHours + CFG.stepMins / 60 <= p.maxHours + 1e-9;
  const delta   = p.overEstimate;
  return `
    <div class="stepper">
      <button class="st-btn" id="hMinus" ${canDown ? '' : 'disabled'} aria-label="Less time">${ico('minus',18,2.4)}</button>
      <div class="st-mid">
        <div class="st-v" id="hVal">${hoursLabel(p.serviceHours)}</div>
        <div class="st-s" id="hSub">${delta === 0 ? 'estimate for this unit size'
          : delta > 0 ? `${hoursLabel(delta/60)} more than the estimate`
          : `${hoursLabel(-delta/60)} less than the estimate`}</div>
      </div>
      <button class="st-btn" id="hPlus" ${canUp ? '' : 'disabled'} aria-label="More time">${ico('plus',18,2.4)}</button>
    </div>
    <div class="mini" style="margin-top:8px">Moves in ${CFG.stepMins}-minute steps. You can take up to ${CFG.reduceMins} minutes off the estimate, and add as much as you like up to the ${CFG.maxHours}-hour cap.</div>
    ${p.hours >= CFG.maxHours - 1e-9 ? `<div class="cap-note">${ico('info',15,2)}
      <span>This job is at the ${CFG.maxHours}-hour cap. A cleaner may not be booked for longer than one ${CFG.maxHours}-hour day, so nothing further can be added.</span></div>` : ''}`;
}

function tasksBlock(){
  const rows = CFG.extras.map(e => {
    const on = B.extras.includes(e.id);
    const ok = extraAllowed(B, e.id);
    return `<button class="task ${on ? 'on' : ''}" data-task="${e.id}" ${ok ? '' : 'disabled'}>
      <span class="tk-box">${ico('check',14,3)}</span>
      <span class="tk-main">
        <span class="tk-t">${e.name}</span>
        <span class="tk-s">${ok ? `adds ${hoursLabel(e.mins/60)}` : `no room — would take the job past ${CFG.maxHours} hours`}</span>
      </span>
      <span class="tk-p">${money(e.price)}</span>
    </button>`;
  }).join('');
  const blocked = CFG.extras.filter(e => !extraAllowed(B, e.id)).length;
  return `<div class="tasks">${rows}</div>
    ${blocked ? `<div class="cap-note">${ico('info',15,2)}
      <span>${blocked} task${blocked > 1 ? 's are' : ' is'} greyed out because this job would run a cleaner past ${CFG.maxHours} hours. Take time off the clean, or book a second visit.</span></div>` : ''}`;
}

function laundryBlock(){
  const finishOK = !!B.wash;
  return `
    <div class="fieldset-t">Type of washing</div>
    <div class="tasks">${CFG.laundryWash.map(w => `

/* ============================================================
   Step gating and wiring
   ============================================================ */
function canAdvance(){
  const svc = svcOf(B.service);
  if(step === 0) return !!B.service;
  if(step === 1){
    if(!svc) return false;
    if(svc.model === 'laundry') return !!(B.wash && B.finish);
    return true;
  }
  if(step === 2) return !!(B.geo && B.date && B.time);
  if(step === 3) return !!B.cleaner;
  return true;
}

function next(){
  if(step === 2 && !validateAddress()) return;
  if(!canAdvance()) return;
  if(step === 4) return pay();
  step = Math.min(step + 1, 5);
  render();
}
function back(){ step = Math.max(step - 1, 0); render(); }

function validateAddress(){
  const need = [['aType', v => !!v], ['aLine', v => v.trim().length > 3], ['aSub', v => v.trim().length > 1]];
  let ok = true;
  need.forEach(([id, test]) => {
    const el = document.getElementById(id);
    if(!el) return;
    const good = test(el.value);
    el.closest('.field').classList.toggle('bad', !good);
    if(!good) ok = false;
  });
  const d = document.getElementById('aDate');
  if(d && d.closest('#afterGeo').style.display !== 'none'){
    const good = !!d.value;
    d.closest('.field').classList.toggle('bad', !good);
    if(!good) ok = false;
  }
  return ok;
}

function fillCities(){
  const sel = document.getElementById('aCity');
  if(!sel) return;
  const list = CFG.provinces[B.addr.prov] || [];
  sel.innerHTML = list.map(c => `<option ${B.addr.city === c ? 'selected' : ''}>${c}</option>`).join('');
  if(!list.includes(B.addr.city)){ B.addr.city = list[0]; sel.value = list[0]; }
}

function wirePane(){
  const nb = document.getElementById('nextBtn');
  if(nb) nb.onclick = next;
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = back);
  const th = document.getElementById('toHome'); if(th) th.onclick = () => go('home');

  /* service */
  document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => {
    B.service = b.dataset.svc; seedForService(); render();
  });
  /* unit size */
  document.querySelectorAll('[data-band]').forEach(b => b.onclick = () => {
    B.band = b.dataset.band;
    B.hours = baseHoursFor(B);
    B.extras = B.extras.filter(id => extraAllowed(B, id));
    B.cleaner = null;
    render();
  });
  /* hours stepper */
  const hm = document.getElementById('hMinus'), hp = document.getElementById('hPlus');
  if(hm) hm.onclick = () => adjustHours(-CFG.stepMins / 60);
  if(hp) hp.onclick = () => adjustHours(+CFG.stepMins / 60);
  /* extras */
  document.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const id = b.dataset.task;
    B.extras = B.extras.includes(id) ? B.extras.filter(x => x !== id) : [...B.extras, id];
    B.cleaner = null;
    render();
  });
  /* laundry */
  document.querySelectorAll('[data-wash]').forEach(b => b.onclick = () => { B.wash = b.dataset.wash; B.hours = null; B.cleaner = null; render(); });
  document.querySelectorAll('[data-finish]').forEach(b => b.onclick = () => { B.finish = b.dataset.finish; B.hours = null; B.cleaner = null; render(); });

  /* address */
  if(document.getElementById('aCity')){
    fillCities();
    const bind = (id, key) => { const el = document.getElementById(id); if(el) el.oninput = () => { B.addr[key] = el.value; }; };
    bind('aLine','line'); bind('aUnit','unit'); bind('aSub','suburb');
    const t = document.getElementById('aType'); t.onchange = () => { B.addr.type = t.value; };
    const pv = document.getElementById('aProv'); pv.onchange = () => { B.addr.prov = pv.value; B.geo = false; B.cleaner = null; render(); };
    const ct = document.getElementById('aCity'); ct.onchange = () => { B.addr.city = ct.value; B.geo = false; B.cleaner = null; render(); };
    const nt = document.getElementById('aNotes'); if(nt) nt.oninput = () => { B.addr.notes = nt.value; };
    const dt = document.getElementById('aDate'); if(dt) dt.onchange = () => { B.date = dt.value; B.cleaner = null; render(); };
    document.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => { B.time = b.dataset.slot; render(); });
    document.querySelectorAll('[data-saved]').forEach(b => b.onclick = () => {
      B.addr = { ...address(b.dataset.saved) }; B.geo = true; B.cleaner = null; render();
    });
    document.getElementById('geoBtn').onclick = () => {
      if(!validateAddress()) return toast('Fill in the address first', 'info');
      const box = document.getElementById('geoBox');
      box.innerHTML = `<div class="geo-idle">${ico('search',24,1.8)}<div style="margin-top:8px">Looking up the address…</div></div>`;
      setTimeout(() => { B.geo = true; B.cleaner = null; render(); toast('Address found and pinned'); }, 450);
    };
  }
  /* workers */
  document.querySelectorAll('[data-pro]').forEach(b => b.onclick = () => { B.cleaner = b.dataset.pro; render(); });
  /* checkout */
  const cn = document.getElementById('cNote'); if(cn) cn.oninput = () => { B.note = cn.value; };
  const cp = document.getElementById('changePro'); if(cp) cp.onclick = () => { step = 3; render(); };
  document.querySelectorAll('[data-card]').forEach(b => b.onclick = () => {
    document.querySelectorAll('[data-card]').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
  const pb = document.getElementById('payBtn'); if(pb) pb.onclick = pay;
  /* done */
  const mc = document.getElementById('mailC'); if(mc) mc.onclick = mailCustomer;
  const mw = document.getElementById('mailW'); if(mw) mw.onclick = mailWorker;
  const ma = document.getElementById('mailA'); if(ma) ma.onclick = mailAdmin;
  const ag = document.getElementById('again'); if(ag) ag.onclick = () => location.reload();
}

function adjustHours(d){
  const p = priceBooking(B);
  const want = Math.round((p.serviceHours + d) * 2) / 2;
  B.hours = Math.min(Math.max(want, p.minHours), p.maxHours);
  B.extras = B.extras.filter(id => extraAllowed(B, id));
  B.cleaner = null;               // a longer job may no longer fit the cleaner you picked
  render();
}

/* ---------- pay ---------- */
let refSeq = 104400;
function pay(){
  const btn = document.getElementById('payBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Authorising…'; }
  setTimeout(() => {
    B.ref = 'SPW-' + (++refSeq);
    const p = priceBooking(B);
    DB.bookings.unshift({
      id:B.ref, cust:'cu1', service:B.service, band:B.band, hours:p.serviceHours,
      wash:B.wash, finish:B.finish, extras:[...B.extras], addr:B.addr.id || { ...B.addr, label:'This booking' },
      cleaner:B.cleaner, date:B.date, time:B.time, status:'upcoming', note:B.note, rating:null
    });
    step = 5; render();
    toast('Payment approved — ' + money(p.total));
  }, 600);
}

go('home');
</script>
