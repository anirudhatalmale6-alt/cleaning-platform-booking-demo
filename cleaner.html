<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparrow — cleaner portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Re-apply the saved palette before the first paint. Doing this from
   app.js instead would show the default colours for a frame, then flip. */
try{var _t=localStorage.getItem('sparrow-theme');
    if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}
</script>
<link rel="stylesheet" href="assets/app.css">
<style>
  .land{max-width:760px;margin:0 auto;padding:40px 0 70px}
  .land h1{font-size:clamp(30px,5vw,44px);margin-bottom:8px}
  .land .lede{color:var(--ink-70);font-size:16px;margin:0 0 26px;max-width:56ch}
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media(max-width:620px){.choice{grid-template-columns:1fr}}
  .ch{border:1.5px solid var(--ink-14);border-radius:var(--radius-lg);padding:20px;background:var(--paper-2);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:.22s var(--ease);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .ch:hover{border-color:var(--moss);transform:translateY(-2px);box-shadow:var(--shadow-1)}
  .ch svg{color:var(--moss)}
  .ch .c-t{font-family:'Fraunces',serif;font-size:21px}
  .ch .c-s{font-size:13.5px;color:var(--ink-45)}
  .form-wrap{max-width:700px;margin:0 auto;padding:26px 0 80px}
  .stepdots{display:flex;gap:7px;margin-bottom:16px}
  .sd{flex:1;height:4px;border-radius:3px;background:var(--ink-08);transition:.3s var(--ease)}
  .sd.on{background:var(--moss)}
  .jobcard{border:1px solid var(--ink-08);border-radius:var(--radius);background:var(--paper-2);padding:16px 17px;margin-bottom:11px}
  .jc-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
  .jc-h .jc-t{font-family:'Fraunces',serif;font-size:20px;flex:1}
</style>
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script src="assets/api.js"></script>
<script>
/* ============================================================
   Cleaner portal.

   The client's rule, verbatim: "ONLY accepted users by the admin
   can sign in and see their dashboard. If the cleaner's account is
   still pending or not yet accepted, it should restrict them from
   signing in."  That gate is enforced in signIn() below and there
   is no way around it in the UI.
   ============================================================ */
let view = 'land';          // land | apply | signin | gate | dash
let me   = null;            // the signed-in cleaner
let gate = null;            // the account that was refused
let tab  = 'today';
let fstep = 0;

const F = { blocked:[] };   // application form answers

const app = () => document.getElementById('app');
const NAV = [['index.html','Website'],['cleaner.html','Cleaner portal']];

function render(){
  app().innerHTML =
    view === 'land'   ? viewLand()
  : view === 'apply'  ? viewApply()
  : view === 'signin' ? viewSignin()
  : view === 'gate'   ? viewGate()
  :                     viewDash();
  wire();
  window.scrollTo(0,0);
}

/* ============================================================
   LANDING — register, or sign in
   ============================================================ */
function viewLand(){
  return `${protoBar('cleaner.html')}${topBar('Cleaner', NAV, 'cleaner.html')}
  <div class="wrap"><div class="land">
    <div class="eyebrow" style="font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--moss);font-weight:700;margin-bottom:12px">Work with Sparrow</div>
    <h1>Choose your own days.<br>Get paid for every hour.</h1>
    <p class="lede">Apply once. Once an admin has approved you, you sign in, block off the days you cannot work, and the jobs customers book you for appear here.</p>
    <div class="choice">
      <button class="ch" id="goApply">${ico('doc',24,1.6)}
        <div class="c-t">Register</div>
        <div class="c-s">New here? Fill in the application form. An admin reviews it and you hear back by email or SMS.</div></button>
      <button class="ch" id="goSignin">${ico('lock',24,1.6)}
        <div class="c-t">Sign in</div>
        <div class="c-s">Already approved? Straight to your calendar and your bookings.</div></button>
    </div>
    <div class="note" style="margin-top:20px">${ico('info',16,2)}
      <span>Applications are not accounts. You cannot sign in until an admin approves you — the sign-in screen will tell you where your application stands.</span></div>
  </div></div>`;
}

/* ============================================================
   SIGN IN — and the gate
   ============================================================ */
function viewSignin(){
  const demos = ['cl1','cl6','cl9'].map(id => cleaner(id));
  return `${protoBar('cleaner.html')}${topBar('Cleaner', NAV, 'cleaner.html')}
  <div class="wrap"><div class="auth-wrap">
    <div class="auth-head"><h1>Sign in</h1><p>Approved cleaners only.</p></div>
    <div class="card panel">
      <div class="field"><label>Email address</label><input id="ciEmail" value="nomsa.m@example.co.za"><div class="err">Enter your email address</div></div>
      <div class="field"><label>Password</label><input id="ciPass" type="password" value="demo1234"><div class="err">Enter your password</div></div>
      <button class="btn btn-primary" style="width:100%" id="ciGo">Sign in</button>
      <div class="auth-alt">Not registered yet? <button id="toApply">Apply to work with us</button></div>
    </div>

    <div class="fieldset-t">Try each account state</div>
    <div class="mini" style="margin-bottom:10px">So you can see the gate working rather than take my word for it.</div>
    <div class="tasks">${demos.map(c => `
      <button class="task" data-as="${c.id}">
        <span class="tk-main"><span class="tk-t">${c.name} ${c.surname}</span>
          <span class="tk-s">Account is ${ACCOUNT[c.account].label.toLowerCase()}</span></span>
        <span class="pill ${ACCOUNT[c.account].cls}">${ACCOUNT[c.account].label}</span>
      </button>`).join('')}</div>
  </div></div>`;
}

function viewGate(){
  const c = gate;
  const pending = c.account === 'pending';
  return `${protoBar('cleaner.html')}${topBar('Cleaner', NAV, 'cleaner.html')}
  <div class="wrap"><div class="auth-wrap">
    <div class="auth-head"><h1>Not yet</h1><p>${c.name}, your account is not open.</p></div>
    <div class="card panel">
      <div class="gate ${pending ? 'wait' : 'bad'}">${ico(pending ? 'clock' : 'x', 20, 2)}
        <div>
          <div class="g-t">${pending ? 'Your application is still with the admins' : 'Your application was declined'}</div>
          ${pending
            ? 'Nothing more for you to do. We review applications within two working days and you will get an email and an SMS the moment there is a decision.'
            : esc(c.declineReason || 'No reason was recorded.')}
        </div>
      </div>
      <div class="rule"></div>
      <div class="mini">Signed in as ${esc(c.name)} ${esc(c.surname)} · account ${ACCOUNT[c.account].label.toLowerCase()}</div>
      <div class="navrow" style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-outline" id="gBack">Back to sign in</button>
        ${pending ? '' : '<button class="btn btn-primary" id="gReapply">Apply again</button>'}
      </div>
    </div>
  </div></div>`;
}

/* ============================================================
   APPLICATION FORM — the client's cleaner document, field for field
   ============================================================ */
const FSTEPS = ['About you','Where you work','Documents','References'];

function viewApply(){
  return `${protoBar('cleaner.html')}${topBar('Cleaner', NAV, 'cleaner.html')}
  <div class="wrap"><div class="form-wrap">
    <div class="stepdots">${FSTEPS.map((_,i) => `<span class="sd ${i <= fstep ? 'on' : ''}"></span>`).join('')}</div>
    <div class="step-t" style="font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-45);margin-bottom:8px">Step ${fstep+1} of ${FSTEPS.length} — ${FSTEPS[fstep]}</div>
    <div class="card panel">${[fs0, fs1, fs2, fs3, fs4][fstep]()}</div>
  </div></div>`;
}

function fs0(){
  return `<h2 style="font-size:25px;margin-bottom:4px">Tell us about you</h2>
    <div class="mini" style="margin-bottom:18px">Exactly as it appears on your ID or passport.</div>
    <div class="grid2">
      <div class="field"><label>First name <span class="req">*</span></label><input id="fFirst" value="${esc(F.first||'')}"><div class="err">Required</div></div>
      <div class="field"><label>Surname <span class="req">*</span></label><input id="fLast" value="${esc(F.last||'')}"><div class="err">Required</div></div>
    </div>
    <div class="field"><label>Date of birth <span class="req">*</span></label><input id="fDob" type="date" value="${esc(F.dob||'')}">
      <div class="hint">You must be 18 or older to work with us.</div>
      <div class="err" id="fDobErr">Enter a valid date of birth</div></div>
    <div class="grid2">
      <div class="field"><label>Mobile number <span class="req">*</span></label><input id="fPhone" placeholder="082 000 0000" value="${esc(F.phone||'')}"><div class="err">Enter a valid South African mobile number</div></div>
      <div class="field"><label>Email address <span class="req">*</span></label><input id="fEmail" type="email" value="${esc(F.email||'')}"><div class="err">Enter a valid email address</div></div>
    </div>
    <div class="field"><label>Which work do you want? <span class="req">*</span></label>
      <div class="radios" id="fGroup">
        <button data-g="indoor" class="${F.group==='indoor'?'on':''}">Indoor cleaner</button>
        <button data-g="outdoor" class="${F.group==='outdoor'?'on':''}">Outdoor cleaner</button>
      </div>
      <div class="err" id="fGroupErr">Pick one</div></div>
    <div class="field"><label>Years of cleaning experience <span class="req">*</span></label>
      <input id="fYears" type="number" min="0" max="50" value="${esc(F.years||'')}"><div class="err">Required</div></div>
    ${navBtns()}`;
}

function fs1(){
  const prov = F.prov || 'Western Cape';
  return `<h2 style="font-size:25px;margin-bottom:4px">Where can you work?</h2>
    <div class="mini" style="margin-bottom:18px">You only get shown to customers in the cities you tick.</div>
    <div class="field"><label>Province <span class="req">*</span></label>
      <select id="fProv">${Object.keys(CFG.provinces).map(p => `<option ${prov===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div class="field"><label>Cities <span class="req">*</span></label>
      <div class="chips" id="fCities"></div>
      <div class="err" id="fCityErr">Pick at least one city</div></div>
    <div class="field"><label>Languages you speak <span class="req">*</span></label>
      <div class="chips" id="fLangs">${['English','Afrikaans','isiZulu','isiXhosa','Sesotho','Setswana','Sepedi','Xitsonga'].map(l =>
        `<button class="chip ${(F.langs||[]).includes(l)?'on':''}" data-lang="${l}">${l}</button>`).join('')}</div>
      <div class="err" id="fLangErr">Pick at least one</div></div>
    <div class="field"><label>Do you have your own transport?</label>
      <div class="radios" id="fTrans">
        <button data-t="yes" class="${F.transport==='yes'?'on':''}">Yes</button>
        <button data-t="no" class="${F.transport==='no'?'on':''}">No</button>
      </div></div>
    ${navBtns()}`;
}

function fs2(){
  const kind = F.idKind || 'id';
  return `<h2 style="font-size:25px;margin-bottom:4px">Documents</h2>
    <div class="mini" style="margin-bottom:18px">The admin sees and downloads these before deciding.</div>
    <div class="field"><label>What are you working on? <span class="req">*</span></label>
      <div class="radios" id="fKind">
        <button data-k="id" class="${kind==='id'?'on':''}">SA ID</button>
        <button data-k="passport" class="${kind==='passport'?'on':''}">Passport</button>
        <button data-k="permit" class="${kind==='permit'?'on':''}">Work permit</button>
      </div></div>
    <div class="field"><label>${kind==='id'?'ID number':kind==='passport'?'Passport number':'Work permit number'} <span class="req">*</span></label>
      <input id="fIdNum" value="${esc(F.idNum||'')}" placeholder="${kind==='id'?'13 digits':'As printed on the document'}">
      <div class="err" id="fIdErr">${kind==='id'?'A South African ID number is 13 digits':'Enter the number on the document'}</div></div>

    <div class="fieldset-t">Uploads</div>
    ${dropField('upId', 'upload',
        `A copy of your ${kind==='id'?'ID':kind==='passport'?'passport':'work permit'}`,
        'Upload your document', `PDF or photo, under ${uploadLimitMb()} MB`, 'fUpIdErr')}
    ${dropField('upPhoto', 'camera', 'Head and shoulders photo',
        'Upload your photo', 'This is the picture customers see when they pick you',
        'fUpPhErr', 'image/*')}
    ${dropField('upCrim', 'shield', 'Criminal record check',
        'Upload your police clearance', 'Issued in the last 12 months', 'fUpCrErr')}
    ${navBtns()}`;
}

/* A real file picker behind a styled box.
   `accept` only filters the picker, it does not stop anything: the server
   sniffs the bytes and is the thing that decides. */
function dropField(key, icon, label, callToAction, hint, errId, accept){
  const picked = F[key];
  return `<div class="field"><label>${label} <span class="req">*</span></label>
    <input type="file" id="file_${key}" data-file="${key}" class="visually-hidden"
      ${accept ? `accept="${accept}"` : 'accept="image/*,application/pdf"'}>
    <label class="drop ${picked ? 'filled' : ''}" for="file_${key}" data-up="${key}">${picked
      ? `${ico('check',20,2.4)}<div><div class="d-t">${esc(picked.name)}</div>
           <div class="d-s">${fileSize(picked.size)} · tap to replace</div></div>`
      : `${ico(icon,22,1.8)}<div class="d-t">${callToAction}</div><div class="d-s">${hint}</div>`}</label>
    <div class="err" id="${errId}">Required</div></div>`;
}

const uploadLimitMb = () =>
  (typeof CFG.maxUploadMb === 'number' && CFG.maxUploadMb > 0) ? CFG.maxUploadMb : 5;

const fileSize = n => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
  : (n / 1048576).toFixed(1) + ' MB';

function fs3(){
  return `<h2 style="font-size:25px;margin-bottom:4px">Two references</h2>
    <div class="mini" style="margin-bottom:18px">People who have paid you for cleaning work. We call them.</div>
    ${[1,2].map(n => `
      <div class="fieldset-t">Reference ${n}</div>
      <div class="grid2">
        <div class="field"><label>Full name <span class="req">*</span></label><input id="fR${n}Name" value="${esc(F['r'+n+'Name']||'')}"><div class="err">Required</div></div>
        <div class="field"><label>Contact number <span class="req">*</span></label><input id="fR${n}Phone" value="${esc(F['r'+n+'Phone']||'')}"><div class="err">Enter a valid number</div></div>
      </div>
      <div class="field"><label>How do they know you? <span class="req">*</span></label>
        <input id="fR${n}Rel" placeholder="Cleaned their home every Tuesday for 3 years" value="${esc(F['r'+n+'Rel']||'')}"><div class="err">Required</div></div>`).join('')}
    <div class="toggle-row"><button class="switch ${F.agree?'on':''}" id="fAgree" aria-label="Agree"></button>
      <div style="font-size:13.5px">I confirm everything here is true, and I agree to a background check.</div></div>
    <div class="err" id="fAgreeErr" style="display:${F.agreeBad?'block':'none'};font-size:12.5px;color:var(--clay);margin-top:-8px;margin-bottom:12px">You have to agree before you can submit.</div>
    ${navBtns('Submit application')}`;
}

function fs4(){
  return `<div style="text-align:center;padding:10px 0">
    <div style="width:66px;height:66px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;margin:0 auto 16px">${ico('clock',30,2.4)}</div>
    <h2 style="font-size:27px;margin-bottom:6px">Application sent</h2>
    <p class="mini" style="max-width:44ch;margin:0 auto 18px">Thanks ${esc(F.first||'')}. An admin will look at it within two working days. You will get an email and an SMS either way — and you cannot sign in until you are approved.</p>
    <div class="rows" style="text-align:left">
      <div class="row-card">${ico('mail',20,1.8)}
        <div class="rc-main"><div class="rc-t">We sent you a confirmation</div><div class="rc-s">${esc(F.email||'')}</div></div>
        <div class="rc-act"><button class="btn btn-outline sm" id="readAck">Read it</button></div></div>
      <div class="row-card">${ico('shield',20,1.8)}
        <div class="rc-main"><div class="rc-t">The admins were told</div><div class="rc-s">Your form is in their approvals queue now</div></div>
        <div class="rc-act"><a class="btn btn-outline sm" href="admin.html">See the queue</a></div></div>
    </div>
    <div style="margin-top:20px"><button class="btn btn-outline" id="backLand">Back to the start</button></div>
  </div>`;
}

function navBtns(lastLabel){
  return `<div class="navrow" style="display:flex;gap:10px;margin-top:22px;align-items:center">
    <button class="btn btn-ghost" id="fBack">${ico('back',16,2.2)} Back</button>
    <button class="btn btn-primary" style="margin-left:auto" id="fNext">${lastLabel || 'Continue'} ${lastLabel ? '' : ico('arrow',16,2.2)}</button>
  </div>`;
}

/* Picking a radio or attaching a file re-renders the step. Without this,
   everything already typed would be wiped by that re-render — so read the
   live inputs back into F first, then redraw.                            */
const FIELD_MAP = {
  fFirst:'first', fLast:'last', fDob:'dob', fPhone:'phone', fEmail:'email', fYears:'years',
  fIdNum:'idNum',
  fR1Name:'r1Name', fR1Phone:'r1Phone', fR1Rel:'r1Rel',
  fR2Name:'r2Name', fR2Phone:'r2Phone', fR2Rel:'r2Rel'
};
function captureForm(){
  Object.entries(FIELD_MAP).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if(el) F[key] = el.value;
  });
}
const redraw = () => { captureForm(); render(); };

/* ---------- form validation ---------- */
function validateStep(){
  const bad = id => { const el = document.getElementById(id); if(el) el.closest('.field').classList.add('bad'); };
  const good = id => { const el = document.getElementById(id); if(el) el.closest('.field').classList.remove('bad'); };
  let ok = true;
  const req = (id, key, test) => {
    const el = document.getElementById(id);
    if(!el) return;
    F[key] = el.value;
    if(test(el.value)) good(id); else { bad(id); ok = false; }
  };

  if(fstep === 0){
    req('fFirst','first', v => v.trim().length > 1);
    req('fLast','last',  v => v.trim().length > 1);
    req('fPhone','phone',v => /^(\+27|0)[6-8][0-9]{8}$/.test(v.replace(/\s/g,'')));
    req('fEmail','email',v => /\S+@\S+\.\S+/.test(v));
    req('fYears','years',v => v !== '' && +v >= 0 && +v <= 50);

    /* 18+ — computed against a fixed "today" so the demo repeats */
    const dob = document.getElementById('fDob');
    F.dob = dob.value;
    const errEl = document.getElementById('fDobErr');
    if(!dob.value){ bad('fDob'); errEl.textContent = 'Enter a valid date of birth'; ok = false; }
    else {
      const now = dateOf(TODAY);
      const [y,m,d] = dob.value.split('-').map(Number);
      let age = now.getFullYear() - y;
      if(now.getMonth()+1 < m || (now.getMonth()+1 === m && now.getDate() < d)) age--;
      if(age < 18){ bad('fDob'); errEl.textContent = `You are ${age}. We cannot take on anyone under 18.`; ok = false; }
      else if(age > 75){ bad('fDob'); errEl.textContent = 'Please check the date — that reads as over 75.'; ok = false; }
      else good('fDob');
    }
    if(!F.group){ document.getElementById('fGroupErr').style.display = 'block'; ok = false; }
    else document.getElementById('fGroupErr').style.display = 'none';
  }

  if(fstep === 1){
    if(!(F.cities || []).length){ document.getElementById('fCityErr').style.display = 'block'; ok = false; }
    else document.getElementById('fCityErr').style.display = 'none';
    if(!(F.langs || []).length){ document.getElementById('fLangErr').style.display = 'block'; ok = false; }
    else document.getElementById('fLangErr').style.display = 'none';
  }

  if(fstep === 2){
    const num = document.getElementById('fIdNum');
    F.idNum = num.value;
    const kind = F.idKind || 'id';
    const numOK = kind === 'id' ? /^[0-9]{13}$/.test(num.value.replace(/\s/g,'')) : num.value.trim().length >= 6;
    if(numOK) good('fIdNum'); else { bad('fIdNum'); ok = false; }
    [['upId','fUpIdErr'],['upPhoto','fUpPhErr'],['upCrim','fUpCrErr']].forEach(([key, err]) => {
      const e = document.getElementById(err);
      if(!F[key]){ e.style.display = 'block'; ok = false; } else e.style.display = 'none';
    });
    // `redraw()` rebuilds this step, and a file input cannot be refilled
    // from script, so the chosen File is held on F and the box shows its
    // name. Losing it on a redraw would be invisible until submit.

  }

  if(fstep === 3){
    [1,2].forEach(n => {
      req(`fR${n}Name`,  `r${n}Name`,  v => v.trim().length > 2);
      req(`fR${n}Phone`, `r${n}Phone`, v => /^(\+27|0)[1-8][0-9]{8}$/.test(v.replace(/\s/g,'')));
      req(`fR${n}Rel`,   `r${n}Rel`,   v => v.trim().length > 3);
    });
    const ae = document.getElementById('fAgreeErr');
    if(!F.agree){ ae.style.display = 'block'; ok = false; } else ae.style.display = 'none';
  }
  return ok;
}

/* ============================================================
   APPROVED DASHBOARD
   ============================================================ */
const TABS = [
  { id:'today',    label:'Today',        icon:'clock' },
  { id:'upcoming', label:'Upcoming',     icon:'cal'   },
  { id:'calendar', label:'My calendar',  icon:'grid'  },
  { id:'past',     label:'Past bookings',icon:'doc'   },
  { id:'profile',  label:'My profile',   icon:'user'  }
];

const myJobs = () => DB.bookings.filter(b => b.cleaner === me.id);

function viewDash(){
  const jobs = myJobs();
  const upcoming = jobs.filter(b => b.status === 'upcoming' && !isPast(b.date)).sort((a,b) => a.date.localeCompare(b.date));
  return `${protoBar('cleaner.html')}${topBar('Cleaner', NAV, 'cleaner.html')}
  <div class="wrap"><div class="shell">
    <aside class="side"><div class="card side-nav" id="sideNav"></div></aside>
    <main>
      <div class="page-head">
        <h1>Good morning, ${me.name}</h1>
        <p>${upcoming.length ? `${upcoming.length} booking${upcoming.length>1?'s':''} coming up · next on ${fmtDate(upcoming[0].date)}` : 'Nothing booked yet. Keep your calendar open and customers will find you.'}</p>
      </div>
      <div id="body"></div>
    </main>
  </div></div>`;
}

function renderTab(){
  sideNav(TABS.map(t => t.id === 'upcoming'
    ? { ...t, badge: myJobs().filter(b => b.status === 'upcoming' && !isPast(b.date)).length || 0 }
    : t), tab, id => { tab = id; renderTab(); });
  document.getElementById('body').innerHTML =
    ({ today:tabToday, upcoming:tabUpcoming, calendar:tabCalendar, past:tabPast, profile:tabProfile })[tab]();
  wireTab();
}

function jobCard(b, opts = {}){
  const p = priceBooking(b), a = addrOf(b), c = custOf(b.cust);
  return `<div class="jobcard">
    <div class="jc-h">
      <div style="flex:1">
        <div class="jc-t">${svcOf(b.service).name}</div>
        <div class="mini">${b.id} · ${fmtDateLong(b.date)} at ${b.time} · ${p.hoursLabel}</div>
      </div>
      ${statusPill(b.status)}
    </div>
    <dl class="kv">
      <dt>Customer</dt><dd>${esc(c ? c.name : '—')}</dd>
      <dt>Job</dt><dd>${esc(jobDetail(b))}</dd>
      <dt>Address</dt><dd>${esc([a.unit, a.line].filter(Boolean).join(', '))}, ${esc(a.suburb)}, ${esc(a.city)}</dd>
      ${b.extras && b.extras.length ? `<dt>Extras</dt><dd>${b.extras.map(id => CFG.extras.find(e => e.id === id).name).join(', ')}</dd>` : ''}
      ${a.notes ? `<dt>Access</dt><dd>${esc(a.notes)}</dd>` : ''}
      ${b.note ? `<dt>Their note</dt><dd>“${esc(b.note)}”</dd>` : ''}
      <dt>You earn</dt><dd class="t-strong">${money(p.labour + p.extras)}</dd>
    </dl>
    ${b.rating ? `<div class="rule"></div>
      <div class="review"><div class="rv-h"><span class="stars">${starRow(b.rating.stars)}</span> ${esc(c ? c.name : '')}</div>
        ${b.rating.comment ? `<div class="rv-b">“${esc(b.rating.comment)}”</div>` : '<div class="rv-b mini">No comment left.</div>'}</div>` : ''}
    ${opts.actions || ''}
  </div>`;
}

function tabToday(){
  const jobs = myJobs().filter(b => b.date === TODAY && b.status !== 'cancelled');
  return `<div class="sect-head"><h2>Today — ${fmtDateLong(TODAY)}</h2></div>
    ${jobs.length ? jobs.map(b => jobCard(b)).join('')
      : `<div class="card panel"><div class="empty">${ico('clock',40,1.4)}
          <div class="e-t">Nothing on today</div>
          <div>Your next job is on ${(() => { const n = myJobs().filter(b => b.status==='upcoming' && !isPast(b.date)).sort((a,c)=>a.date.localeCompare(c.date))[0]; return n ? fmtDateLong(n.date) : 'no date yet'; })()}.</div>
        </div></div>`}`;
}

function tabUpcoming(){
  const jobs = myJobs().filter(b => b.status === 'upcoming' && !isPast(b.date)).sort((a,b) => a.date.localeCompare(b.date));
  return `<div class="sect-head"><h2>Upcoming bookings</h2>
      <div class="sh-sub">Booked by customers who picked you.</div></div>
    ${jobs.length ? jobs.map(b => jobCard(b)).join('')
      : `<div class="card panel"><div class="empty">${ico('cal',40,1.4)}<div class="e-t">Nothing booked</div>
          <div>Open up more days on your calendar so customers can find you.</div></div></div>`}`;
}

function tabPast(){
  const jobs = myJobs().filter(b => b.status === 'completed' || b.status === 'cancelled').sort((a,b) => b.date.localeCompare(a.date));
  const earned = jobs.filter(b => b.status === 'completed')
    .reduce((n, b) => { const p = priceBooking(b); return n + p.labour + p.extras; }, 0);
  return `<div class="sect-head"><h2>Past bookings</h2>
      <div class="sh-sub">${jobs.filter(b=>b.status==='completed').length} completed · ${money(earned)} earned</div></div>
    ${jobs.length ? jobs.map(b => jobCard(b)).join('')
      : `<div class="card panel"><div class="empty">${ico('doc',40,1.4)}<div class="e-t">No history yet</div></div></div>`}`;
}

/* ---------- calendar: block off days ---------- */
let calMonth = 7;   // 0-indexed; August 2026
let calYear  = 2026;

function tabCalendar(){
  const first = new Date(calYear, calMonth, 1);
  const days  = new Date(calYear, calMonth + 1, 0).getDate();
  const lead  = first.getDay();
  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<span></span>');
  for(let d = 1; d <= days; d++){
    const iso = isoOf(new Date(calYear, calMonth, d));
    const off = (me.blocked || []).includes(iso);
    const booked = myJobs().some(b => b.date === iso && b.status !== 'cancelled');
    const past = isPast(iso);
    const cls = [past ? '' : '', off ? 'off' : '', booked ? 'booked' : '', iso === TODAY ? 'today' : ''].filter(Boolean).join(' ');
    cells.push(`<button class="cal-day ${cls}" data-day="${iso}" ${past || booked ? 'disabled' : ''}
      title="${booked ? 'You have a booking this day' : off ? 'Marked unavailable' : 'Available'}">
      ${d}${booked ? '<span class="cd-dot"></span>' : ''}</button>`);
  }
  const offCount = (me.blocked || []).filter(d => !isPast(d)).length;
  return `<div class="sect-head"><h2>My calendar</h2>
      <div class="sh-sub">Tap a day to mark yourself unavailable. Customers will not see you on those days.</div></div>
    <div class="card panel">
      <div class="cal-head">
        <button class="pill-btn sm" id="calPrev">${ico('back',14,2.2)}</button>
        <div class="ch-t">${MONTHS[calMonth]} ${calYear}</div>
        <button class="pill-btn sm" id="calNext">${ico('arrow',14,2.2)}</button>
      </div>
      <div class="cal-grid">${DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('')}${cells.join('')}</div>
      <div class="cal-key">
        <span><i style="background:var(--paper-2);border:1.5px solid var(--ink-08)"></i>Available</span>
        <span><i style="background:var(--clay-soft);border:1.5px solid rgba(192,82,44,.34)"></i>You marked unavailable</span>
        <span><i style="background:var(--moss-soft);border:1.5px solid rgba(44,85,72,.3)"></i>Already booked — cannot block</span>
      </div>
      <div class="note" style="margin-top:16px">${ico('info',16,2)}
        <span>${offCount ? `You have blocked off ${offCount} upcoming day${offCount>1?'s':''}.` : 'You are available every upcoming day this month.'} A day you are already booked on cannot be blocked — cancel the booking first.</span></div>
    </div>`;
}

/* ============================================================
   WIRING
   ============================================================ */
/* Pull this cleaner's own record, jobs and calendar out of the database
   and into the object the screens already read. */
async function loadMe(){
  const r = await API.get('employee/me');
  const e = r.employee;
  me = {
    id: 'cl' + e.id, name: e.first_name, surname: e.last_name,
    initials: (e.first_name[0] || '') + (e.last_name[0] || ''),
    email: e.email, phone: e.phone,
    rating: Number((r.rating && r.rating.rating_avg) || 0),
    jobs: Number((r.rating && r.rating.jobs_completed) || 0),
    years: Number(e.years_experience || 0),
    langs: r.languages || [], group: e.service_group,
    city: (r.areas[0] || {}).city || '', prov: (r.areas[0] || {}).province || '',
    account: e.account_status, idNumber: e.id_number,
    skin:'#8a5a3b', hair:'#2a1e18', shirt:'#2F5D50',
    blocked: r.unavailable || [],
    documents: r.documents || []
  };
  DB.cleaners = [me];
  DB.bookings = r.jobs.map(j => ({
    id: j.reference, cust: 'cu' + j.customer_id, service: j.service_code,
    band: j.bedroom_band || undefined, wash: j.laundry_wash || undefined,
    finish: j.laundry_finish || undefined,
    rooms: j.window_rooms == null ? undefined : Number(j.window_rooms),
    vehicle: j.vehicle_size || undefined,
    hours: Number(j.hours_booked), extras: [],
    addr: { line: j.address_line, unit: j.address_unit || '', suburb: j.address_suburb,
            city: j.address_city, prov: j.address_province, notes: j.access_notes || '',
            label: 'Job address', type: 'House' },
    cleaner: 'cl' + j.employee_id, date: j.scheduled_date,
    time: (j.scheduled_time || '').slice(0, 5), status: j.status,
    note: j.note_for_worker || '', rating: null
  }));
  DB.customers = r.jobs.map(j => ({
    id: 'cu' + j.customer_id,
    name: j.customer_first + ' ' + j.customer_last,
    initials: (j.customer_first[0] || '') + (j.customer_last[0] || ''),
    email: '', phone: j.customer_phone || '', tone: '', joined: ''
  }));
}

function signIn(id){
  const c = cleaner(id);
  if(c.account !== 'approved'){ gate = c; view = 'gate'; render(); return; }
  me = c; view = 'dash'; tab = 'today'; render();
}

function wire(){
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };

  on('goApply', () => { view = 'apply'; fstep = 0; render(); });
  on('goSignin', () => { view = 'signin'; render(); });
  on('toApply', () => { view = 'apply'; fstep = 0; render(); });
  on('gBack', () => { view = 'signin'; render(); });
  on('gReapply', () => { view = 'apply'; fstep = 0; render(); });
  on('backLand', () => { view = 'land'; render(); });
  on('ciGo', async () => {
    const em = document.getElementById('ciEmail'), pw = document.getElementById('ciPass');
    let bad = false;
    [[em, /\S+@\S+\.\S+/.test(em.value)], [pw, pw.value.length > 0]].forEach(([el, ok]) => {
      el.closest('.field').classList.toggle('bad', !ok); if(!ok) bad = true;
    });
    if(bad) return;

    /* With a database, the gate lives in the API. Turning this button back
       on in the browser achieves nothing: /employee/login refuses a pending
       or declined account before any session exists. */
    if(API.live){
      try {
        await API.post('employee/login', { email: em.value.trim(), password: pw.value });
        await loadMe();
        view = 'dash'; tab = 'today'; render();
      } catch (e) {
        const d = e.data || {};
        if(d.account_status){
          gate = { name: d.first_name || '', account: d.account_status,
                   declineReason: d.decline_reason || '' };
          view = 'gate'; render();
        } else {
          toast(e.message || 'Those details do not match an application', 'alert');
        }
      }
      return;
    }
    signIn('cl1');
  });
  document.querySelectorAll('[data-as]').forEach(b => b.onclick = () => signIn(b.dataset.as));

  if(view === 'apply') wireForm();
  if(view === 'dash') renderTab();
}

function wireForm(){
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };

  on('fBack', () => { captureForm(); if(fstep === 0){ view = 'land'; } else fstep--; render(); });
  on('fNext', () => {
    if(!validateStep()) return toast('Check the fields in red', 'info');
    captureForm();
    if(fstep === 3) return submitApplication();
    fstep++; render();
  });

  document.querySelectorAll('#fGroup button').forEach(b => b.onclick = () => { F.group = b.dataset.g; redraw(); });
  document.querySelectorAll('#fTrans button').forEach(b => b.onclick = () => { F.transport = b.dataset.t; redraw(); });
  document.querySelectorAll('#fKind button').forEach(b => b.onclick = () => { F.idKind = b.dataset.k; F.idNum = ''; redraw(); });
  document.querySelectorAll('#fLangs [data-lang]').forEach(b => b.onclick = () => {
    const l = b.dataset.lang;
    F.langs = (F.langs || []).includes(l) ? F.langs.filter(x => x !== l) : [...(F.langs || []), l];
    b.classList.toggle('on');
  });
  /* The file is held here until the application is submitted. It cannot be
     uploaded earlier: there is no employee row to attach it to yet, and
     parking files against applications that are never finished would mean
     storing people's ID copies for no reason. */
  document.querySelectorAll('[data-file]').forEach(inp => inp.onchange = () => {
    const key = inp.dataset.file;
    const file = inp.files && inp.files[0];
    if(!file) return;
    // The real limit comes from the server, because php.ini can be lower
    // than the setting and the worker would otherwise be told 5 MB and
    // stopped at 2.
    const maxMb = (typeof CFG.maxUploadMb === 'number' && CFG.maxUploadMb > 0)
      ? CFG.maxUploadMb : 5;
    if(file.size > maxMb * 1024 * 1024){
      toast(`That file is ${(file.size/1048576).toFixed(1)} MB. The limit is ${maxMb} MB.`, 'alert');
      inp.value = ''; return;
    }
    F[key] = file;
    redraw(); toast(file.name + ' attached');
  });
  on('fAgree', () => { F.agree = !F.agree; redraw(); });

  const prov = document.getElementById('fProv');
  if(prov){
    prov.onchange = () => { F.prov = prov.value; F.cities = []; fillCityChips(); };
    fillCityChips();
  }
  on('readAck', () => sendNotice({
    channel:'email', to:F.email || '',
    subject:'We have your Sparrow application',
    body:`<h4>Thanks, ${esc(F.first || '')}.</h4>
      <p>Your application to work as ${F.group === 'outdoor' ? 'an outdoor' : 'an indoor'} cleaner is with our admin team. We review applications within two working days.</p>
      <p>You will get an email and an SMS the moment there is a decision. Until then you will not be able to sign in — that is normal.</p>
      <p style="color:#6b7a70;font-size:12.5px">Applied for: ${F.group === 'outdoor' ? 'Outdoor' : 'Indoor'} cleaner · ${(F.cities || []).join(', ')}</p>` }));
}

function fillCityChips(){
  const box = document.getElementById('fCities');
  if(!box) return;
  const list = CFG.provinces[F.prov || 'Western Cape'] || [];
  box.innerHTML = list.map(c =>
    `<button class="chip ${(F.cities || []).includes(c) ? 'on' : ''}" data-city="${c}">${c}</button>`).join('');
  box.querySelectorAll('[data-city]').forEach(b => b.onclick = () => {
    const c = b.dataset.city;
    F.cities = (F.cities || []).includes(c) ? F.cities.filter(x => x !== c) : [...(F.cities || []), c];
    b.classList.toggle('on');
  });
}

async function submitApplication(){
  if(API.live) return submitApplicationLive();
  const id = 'cl' + (DB.cleaners.length + 20);
  DB.cleaners.push({
    id, name:F.first, surname:F.last, initials:(F.first[0] + F.last[0]).toUpperCase(),
    rating:0, jobs:0, years:+F.years || 0, langs:F.langs || ['English'],
    group:F.group, city:(F.cities || [])[0], prov:F.prov || 'Western Cape',
    account:'pending', fav:false, skin:'#8a5a3b', hair:'#2a1e18', shirt:'#2F5D50', blocked:[]
  });
  DB.applications.unshift({ id, submitted:TODAY });
  fstep = 4; render();
  toast('Application submitted');
}

/* The real thing: the application is written first, which hands back a
   one-time token, and the documents are uploaded against it. Done in that
   order because an applicant has no account to authenticate with, and
   because an application that lands without its files can still be chased,
   whereas files with no application are just somebody's ID sitting on a
   disk. */
async function submitApplicationLive(){
  const btn = document.getElementById('fNext');
  const setBusy = t => { if(btn){ btn.disabled = true; btn.textContent = t; } };
  setBusy('Sending your application…');

  let created;
  try {
    created = await API.post('employee/apply', {
      first_name: F.first, last_name: F.last, email: F.email, phone: F.phone,
      date_of_birth: F.dob,
      id_type: F.idKind === 'passport' ? 'passport' : 'sa_id',
      id_number: F.idNum,
      service_group: F.group,
      years_experience: +F.years || 0,
      has_own_transport: !!F.transport,
      languages: F.langs || ['English'],
      areas: (F.cities || []).map(city => ({ province: F.prov, city }))
    });
  } catch (e) {
    if(btn){ btn.disabled = false; btn.textContent = 'Submit application'; }
    toast(e.message || 'That application could not be sent', 'alert');
    return;
  }

  const files = [['upId','id'], ['upPhoto','photo'], ['upCrim','criminal_check']]
    .filter(([key]) => F[key] instanceof File);
  const failed = [];
  for(let i = 0; i < files.length; i++){
    const [key, docType] = files[i];
    setBusy(`Uploading ${i + 1} of ${files.length}…`);
    const fd = new FormData();
    fd.append('file', F[key]);
    fd.append('doc_type', docType);
    fd.append('employee_id', created.id);
    fd.append('upload_token', created.upload_token);
    try {
      const res = await fetch(API.base + 'employee/documents',
                              { method:'POST', credentials:'include', body: fd });
      if(!res.ok){
        const d = await res.json().catch(() => ({}));
        throw new Error(d.error || 'Upload failed');
      }
    } catch (e) {
      failed.push(`${F[key].name}: ${e.message}`);
    }
  }

  F.applicationId = created.id;
  fstep = 4; render();
  if(failed.length){
    // The application exists either way. Saying so beats a silent failure
    // that the applicant only discovers when they are declined for a
    // missing document.
    toast('Application sent, but ' + failed.length + ' file did not upload', 'alert');
    modal({ title:'Some files did not upload',
      sub:'Your application has been sent. These documents need another try.',
      body:`<ul style="margin:0;padding-left:18px">${failed.map(x =>
              `<li>${esc(x)}</li>`).join('')}</ul>
            <div class="note warn" style="margin-top:12px">${ico('info',16,2)}
              <span>Contact the office and they will send you a new upload link.</span></div>`,
      actions:[{ label:'Close', cls:'btn-outline' }] });
  } else {
    toast('Application and documents sent');
  }
}

function wireTab(){
  const on = (id, fn) => { const el = document.getElementById(id); if(el) el.onclick = fn; };
  on('calPrev', () => { calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } renderTab(); });
  on('calNext', () => { calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } renderTab(); });
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = async () => {
    const iso = b.dataset.day;
    me.blocked = me.blocked || [];
    const wasBlocked = me.blocked.includes(iso);

    if(API.live){
      b.disabled = true;
      try {
        await API.blockDay(iso, wasBlocked);
      } catch (e) {
        b.disabled = false;
        // The server refuses a day the cleaner is already booked on. The
        // calendar is not updated, so it keeps showing the truth.
        toast(e.message || 'That day could not be changed', 'alert');
        return;
      }
      b.disabled = false;
    }

    if(wasBlocked){ me.blocked = me.blocked.filter(d => d !== iso); toast('Available again on ' + fmtDate(iso)); }
    else { me.blocked.push(iso); toast('Marked unavailable on ' + fmtDate(iso)); }
    renderTab();
  });
  /* A real photo upload for an approved cleaner. No token here: she is
     signed in, and the API takes the employee id from the session rather
     than from anything this page sends, so she can only replace her own. */
  const pf = document.getElementById('photoFile');
  if(pf) pf.onchange = async () => {
    const file = pf.files && pf.files[0];
    if(!file) return;
    if(!API.live){ toast('Photo updated — customers see it right away'); return; }
    const drop = document.getElementById('photoDrop');
    const was = drop ? drop.innerHTML : '';
    if(drop) drop.innerHTML = '<div class="d-t">Uploading…</div>';
    const fd = new FormData();
    fd.append('file', file);
    fd.append('doc_type', 'photo');
    try {
      const res = await fetch(API.base + 'employee/documents',
                              { method:'POST', credentials:'include', body: fd });
      const d = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(d.error || 'Upload failed');
      await loadMe();
      renderTab();
      toast('Photo updated — customers see it right away');
    } catch (e) {
      if(drop) drop.innerHTML = was;
      pf.value = '';
      toast(e.message || 'That photo could not be uploaded', 'alert');
    }
  };
  on('pSave', () => toast('Profile saved'));
}

(async () => {
  try {
    if (await API.boot()){
      // Already signed in from an earlier visit? Go straight to the dashboard.
      try { await loadMe(); view = 'dash'; tab = 'today'; } catch (e) {}
    }
  } catch (e) { console.warn('API boot', e); }
  render();
})();
</script>
